services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./backend:/app
      - director_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    env_file: .env
    volumes:
      - ./backend:/app
      - director_data:/data
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: director
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  director_data:
  redis_data:
  postgres_data:
