services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DIRECTOR_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DIRECTOR_AUTO_CREATE_SCHEMA: "false"
    volumes:
      - ./backend:/app
      - director_data:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --queues=director.render,director.revisions,director.email,director.maintenance,director.governance
    env_file: .env
    environment:
      DIRECTOR_AUTO_CREATE_SCHEMA: "false"
    volumes:
      - ./backend:/app
      - director_data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      DIRECTOR_AUTO_CREATE_SCHEMA: "false"
    volumes:
      - ./backend:/app
      - director_data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: director
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director -d director"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  director_data:
  redis_data:
  postgres_data:
