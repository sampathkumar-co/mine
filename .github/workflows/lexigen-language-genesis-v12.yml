name: Lexigen Language Genesis v12

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/v12/**"
      - "lexigen-language-genesis/external/arcgen_gate_v12.py"
      - ".github/workflows/lexigen-language-genesis-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hierarchical-multifamily-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen v12 branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Check out preserved v11 campaign evidence
        uses: actions/checkout@v4
        with:
          ref: lexigen/external-arcgen-v11-campaign
          path: campaign

      - name: Check out pinned ARC-GEN source
        uses: actions/checkout@v4
        with:
          repository: google/ARC-GEN
          ref: a15cbdb44c776610aeeb9f487a06af875d3d0878
          path: arcgen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Run v12 adversarial tests
        working-directory: current/lexigen-language-genesis/v12
        run: python -m pytest -q

      - name: Validate sealed-gate adapter
        working-directory: current/lexigen-language-genesis/external
        run: python -m py_compile arcgen_gate_v12.py

      - name: Reproduce three-family v12 mechanism gate
        working-directory: current/lexigen-language-genesis/v12
        run: |
          python replay_v12_multifamily.py \
            --campaign-root ../../../campaign/lexigen-language-genesis/external/evidence/v11-campaign \
            --arcgen-root ../../../arcgen \
            --output-dir artifacts/v12

      - name: Hash evidence
        working-directory: current/lexigen-language-genesis/v12
        run: sha256sum artifacts/v12/*.json | tee artifacts/v12/SHA256SUMS

      - name: Upload v12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-language-genesis-v12-${{ github.sha }}
          path: current/lexigen-language-genesis/v12/artifacts/v12/
          if-no-files-found: error
          retention-days: 90
