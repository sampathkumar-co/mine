name: LEXIGEN v4 Task 2 Min Dominating Set Synthetic R1B

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/02-min-dominating-set/TRIGGER_SYNTHETIC_R1B"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/02-min-dominating-set/requirements.txt
      - name: Verify immutable engine and selection locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify preserved failure and frozen r1b correction package
        working-directory: lexigen-v4/tasks/02-min-dominating-set
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "candidates.py": "cc020a9733e9c55aa5524e84a3b6201fcefbb6fb",
              "validate_candidates.py": "c606023b13ef6d2c8c8fa6025dc6698980849cb0",
              "requirements.txt": "6b6bc893815835562a66a5a98c79e0c087978969",
              "SYNTHETIC_R1_FAILURE.json": "dafc2d3fb718118471de81ed45a564c2fe60d290",
              "candidates_r1b.py": "bd41002d82e9725193df7235fa1ac4140900bb2a",
              "validate_candidates_r1b.py": "84991f1419220ff00bcc065e0f917065d0f70ab5",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          print("LEXIGEN_V4_TASK2_SYNTHETIC_R1B_FROZEN")
          PY
      - name: Install frozen dependencies
        working-directory: lexigen-v4/tasks/02-min-dominating-set
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Re-run complete unchanged 28-candidate exhaustive oracle through generic empty-input correction
        working-directory: lexigen-v4/tasks/02-min-dominating-set
        run: python -u validate_candidates_r1b.py
      - name: Upload immutable r1b synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task2-min-dominating-set-synthetic-r1b
          path: lexigen-v4/tasks/02-min-dominating-set/synthetic-evidence/
          if-no-files-found: error
          retention-days: 90
