name: LEXIGEN v5 Task 1 Clustering Outliers Source R1

on:
  pull_request:
    branches:
      - lexigen/v5-transfer-causal-preregister-r1
    paths:
      - "lexigen-v5/tasks/01-clustering-outliers/TRIGGER_SOURCE_R1"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen campaign engine lock
        working-directory: lexigen-v5
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock = json.loads(Path("ENGINE_LOCK.json").read_text())
          # The selection workflow is intentionally retired after selection; verify the still-present scientific files.
          for key, wanted in lock["git_blob_sha1"].items():
              if key == "workflow":
                  continue
              path = Path(key)
              data = path.read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"campaign lock mismatch {key}: {actual} != {wanted}")
          print("LEXIGEN_V5_CAMPAIGN_SCIENTIFIC_LOCK_VERIFIED")
          PY
      - name: Verify Task 1 source lock before source access
        working-directory: lexigen-v5
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock = json.loads(Path("tasks/01-clustering-outliers/SOURCE_R1_LOCK.json").read_text())
          paths = {
              "TASK_START.json": Path("tasks/01-clustering-outliers/TASK_START.json"),
              "prepare_source.py": Path("tasks/01-clustering-outliers/prepare_source.py"),
              "workflow": Path("../.github/workflows/lexigen-v5-task1-clustering-outliers-source-r1.yml"),
          }
          for key, wanted in lock["git_blob_sha1"].items():
              data = paths[key].read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"Task 1 source lock mismatch {key}: {actual} != {wanted}")
          if lock["task_source_opened_before_lock"] or lock["task_description_opened_before_lock"]:
              raise SystemExit("Task 1 source boundary violated before source lock")
          if lock["training_manifest_opened_before_lock"] or lock["training_payloads_opened_before_lock"] or lock["test_manifest_opened_before_lock"] or lock["test_payloads_opened_before_lock"]:
              raise SystemExit("official data boundary violated before source lock")
          print("LEXIGEN_V5_TASK1_SOURCE_R1_LOCK_VERIFIED_BEFORE_SOURCE_ACCESS")
          PY
      - name: Compile frozen Task 1 source package
        working-directory: lexigen-v5
        run: python -m compileall -q engine.py tasks/01-clustering-outliers/prepare_source.py
      - name: Generate all-arm proposals from permitted Task 1 source only
        working-directory: lexigen-v5
        run: python -u tasks/01-clustering-outliers/prepare_source.py --task-start tasks/01-clustering-outliers/TASK_START.json --output tasks/01-clustering-outliers/source-analysis-evidence
      - name: Upload immutable Task 1 source-analysis evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task1-clustering-outliers-source-r1
          path: lexigen-v5/tasks/01-clustering-outliers/source-analysis-evidence/
          if-no-files-found: error
          retention-days: 90
