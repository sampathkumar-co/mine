name: LEXIGEN World Covering Record v1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-world-covering-v1/TRIGGER_ONCE"

permissions:
  contents: read

jobs:
  discover-covering-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: lexigen-world-covering-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-world-covering-v1/requirements.txt

      - name: Verify preregistration lock before snapshot access
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = json.loads(Path("LOCK.json").read_text(encoding="utf-8"))
          for name, expected in lock["sha256"].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"frozen hash mismatch for {name}: {actual} != {expected}")
          if lock["snapshot_md5"] != "b2c626b07f216aac830d344eff5ad523":
              raise SystemExit("snapshot commitment changed")
          if lock["target_count"] != 3:
              raise SystemExit("target count changed")
          print("LEXIGEN_WORLD_COVERING_V1_LOCK_VERIFIED")
          PY

      - name: Install frozen solver
        run: python -m pip install -r requirements.txt

      - name: Select untouched targets and execute generic engine
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python -u selector_solver.py --output artifacts 2>&1 | tee artifacts/execution.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/solver-exit-code.txt
          exit "$code"

      - name: Independently verify serialized record candidates
        if: always() && hashFiles('lexigen-world-covering-v1/artifacts/SUMMARY.json') != ''
        shell: bash
        run: |
          set +e
          python -u verify_results.py \
            --summary artifacts/SUMMARY.json \
            --output artifacts/INDEPENDENT_VERIFICATION.json \
            2>&1 | tee artifacts/verification.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/verifier-exit-code.txt
          exit "$code"

      - name: Upload immutable discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-world-covering-v1-evidence
          path: lexigen-world-covering-v1/artifacts/
          if-no-files-found: error
          retention-days: 90
