name: LEXIGEN v6 Tasks4-6 Pretraining Repair R1
on:
  push:
    branches: [lexigen/v6-parallel-7-r1]
    paths: ["lexigen-v6/parallel7/TRIGGER_TASK46_REPAIR_TRAIN_R1"]
permissions:
  contents: write
  actions: read
jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        task: [ode_lorenz96_nonchaotic, edge_expansion]
        shard: [0,1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify Task4/6 repair lock before official training
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/parallel7/TASK46_REPAIR_LOCK.json').read_text())
          for key,path in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=lock['git_blob_sha1'][key]: raise SystemExit(f"repair lock mismatch {key}: {got}")
          if lock['tasks_4_6_official_training_manifests_opened_before_repair_lock']:
              raise SystemExit('Task4/6 training boundary crossed before repair lock')
          if lock['test_manifests_opened_before_repair_lock'] or lock['test_payloads_opened_before_repair_lock']:
              raise SystemExit('test boundary crossed')
          PY
      - name: Install exact frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.2" "scipy==1.16.1" "networkx==3.6.1" "ortools==9.11.4210" "cvxpy==1.7.2"
      - name: Compile repair package
        run: python -m py_compile lexigen-v5/engine.py lexigen-v6/parallel7/parallel_candidates.py lexigen-v6/parallel7/parallel_train.py lexigen-v6/parallel7/parallel_train_v2.py lexigen-v6/parallel7/parallel_task46_overlay.py lexigen-v6/parallel7/parallel_train_task46_repair.py lexigen-v6/parallel7/parallel_aggregate.py
      - name: Run corrected synthetic certificate then official training shard
        env:
          PYTHONPATH: lexigen-v5:lexigen-v6/parallel7
        run: python lexigen-v6/parallel7/parallel_train_task46_repair.py --task "${{ matrix.task }}" --shard "${{ matrix.shard }}" --output "train-shards/${{ matrix.task }}-shard-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-train-${{ matrix.task }}-shard-${{ matrix.shard }}
          path: train-shards/${{ matrix.task }}-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: shard
    strategy:
      fail-fast: false
      matrix:
        task: [ode_lorenz96_nonchaotic, edge_expansion]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          pattern: repair-train-${{ matrix.task }}-shard-*
          path: train-shards
          merge-multiple: true
      - run: python lexigen-v6/parallel7/parallel_aggregate.py --task "${{ matrix.task }}" --input train-shards --output "aggregated/${{ matrix.task }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task46-repair-${{ matrix.task }}-train-r1
          path: aggregated/${{ matrix.task }}/
          if-no-files-found: error
          retention-days: 90
  seal:
    needs: aggregate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexigen/v6-parallel-7-r1
      - uses: actions/download-artifact@v4
        with:
          pattern: lexigen-v6-task46-repair-*-train-r1
          path: repair-results
      - name: Seal corrected Task4/6 training only
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          tasks=['ode_lorenz96_nonchaotic','edge_expansion']
          status={'stage':'task46_repair_training_sealed','workflow_run_id':int(os.environ['RUN_ID']),'trigger_head_sha':os.environ['HEAD_SHA'],'tasks':[],'test_manifests_opened':False,'test_payloads_opened':0}
          for task in tasks:
              src=Path(f'repair-results/lexigen-v6-task46-repair-{task}-train-r1/train-summary.json')
              if not src.exists(): raise SystemExit(f'missing {task}')
              summary=json.loads(src.read_text())
              out=Path(f'lexigen-v6/parallel7/results/{task}'); out.mkdir(parents=True,exist_ok=True)
              (out/'TRAIN_R1_RESULT.json').write_text(json.dumps(summary,indent=2)+'\n')
              status['tasks'].append({'task':task,'full_harmonic_speedup':summary['selected_by_arm']['v6_full']['harmonic_speedup'],'full_minimum_speedup':summary['selected_by_arm']['v6_full']['minimum_speedup'],'selected_pair_semantically_distinct':summary['training_diagnostics']['selected_full_no_transfer_semantically_distinct']})
          Path('lexigen-v6/parallel7/TASK46_REPAIR_TRAIN_STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexigen-v6/parallel7/results/ode_lorenz96_nonchaotic lexigen-v6/parallel7/results/edge_expansion lexigen-v6/parallel7/TASK46_REPAIR_TRAIN_STATUS.json
          git commit -m "lexigen v6: seal corrected Tasks 4 and 6 training"
          git push origin HEAD:lexigen/v6-parallel-7-r1
