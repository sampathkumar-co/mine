name: Lexigen Language Genesis v8

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/v8/**"
      - "lexigen-language-genesis/external/arcgen_gate_v8.py"
      - ".github/workflows/lexigen-language-genesis-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta-grammar-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen v8 branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Check out gate-6 redacted evidence only
        uses: actions/checkout@v4
        with:
          ref: lexigen/external-arcgen-gate6-reveal
          path: reveal

      - name: Check out pinned ARC-GEN source
        uses: actions/checkout@v4
        with:
          repository: google/ARC-GEN
          ref: a15cbdb44c776610aeeb9f487a06af875d3d0878
          path: arcgen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Run v8 adversarial tests
        working-directory: current/lexigen-language-genesis/v8
        run: python -m pytest -q

      - name: Validate sealed-gate adapter imports
        working-directory: current/lexigen-language-genesis/external
        run: python -m py_compile arcgen_gate_v8.py

      - name: Reproduce v8 meta-grammar gate
        working-directory: current/lexigen-language-genesis/v8
        run: |
          python replay_gate6_v8.py \
            --redacted ../../../reveal/lexigen-language-genesis/external/evidence/arcgen-gate6-reveal/redacted-task.json \
            --arcgen-root ../../../arcgen \
            --output-dir artifacts/v8

      - name: Hash evidence
        working-directory: current/lexigen-language-genesis/v8
        run: sha256sum artifacts/v8/*.json | tee artifacts/v8/SHA256SUMS

      - name: Upload v8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-language-genesis-v8-${{ github.sha }}
          path: current/lexigen-language-genesis/v8/artifacts/v8/
          if-no-files-found: error
          retention-days: 90
