name: Lexigen v11 Campaign Pre-Score

on:
  pull_request:
    paths:
      - ".github/workflows/lexigen-v11-campaign-prescore.yml"
      - "lexigen-language-genesis/external/evidence/v11-campaign/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve-unfinished-gates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out campaign evidence branch
        uses: actions/checkout@v4
        with:
          ref: lexigen/external-arcgen-v11-campaign
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen language tree
        run: |
          git diff --exit-code c0b32603fc367506bc1721a6e8a480fd8fe882b2 -- \
            lexigen-language-genesis/v7 \
            lexigen-language-genesis/v8 \
            lexigen-language-genesis/v9 \
            lexigen-language-genesis/v10 \
            lexigen-language-genesis/v11

      - name: Solve all unfinished gates without hidden outputs
        working-directory: lexigen-language-genesis/external
        run: |
          set -euo pipefail
          for n in $(seq -w 1 10); do
            gate="v11-campaign-${n}"
            evidence="evidence/v11-campaign/${gate}"
            if [ -f "${evidence}/result.json" ]; then
              echo "${gate}: already preserved; skipping"
              continue
            fi
            test -f "${evidence}/redacted-task.json"
            test -f "${evidence}/seal-manifest.json"
            out="${evidence}/candidate"
            rm -rf "${out}"
            mkdir -p "${out}"
            LEXIGEN_V11_CAMPAIGN_GATE="${gate}" \
              python arcgen_campaign_v11.py solve \
                --redacted "${evidence}/redacted-task.json" \
                --output-dir "${out}"
            cp "${out}/candidate-report.json" "${evidence}/candidate-report.json"
            if [ -f "${out}/candidate-predictions.json" ]; then
              cp "${out}/candidate-predictions.json" "${evidence}/candidate-predictions.json"
              cp "${out}/candidate-compositional-pipeline.json" "${evidence}/candidate-compositional-pipeline.json"
              python - "${gate}" "${evidence}" <<'PY'
          import json, pathlib, sys
          gate, folder = sys.argv[1], pathlib.Path(sys.argv[2])
          report = json.loads((folder / 'candidate-report.json').read_text())
          result = {
              'gate_id': gate,
              'selected_task_id': report['selected_task_id'],
              'status': 'candidate-committed-awaiting-one-shot-score',
              'predictions_committed': True,
              'hidden_scoring_performed': False,
              'sealed_outputs_accessed': False,
              'breakthrough_candidate': bool(report.get('breakthrough_candidate')),
          }
          (folder / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
            else
              python - "${gate}" "${evidence}" <<'PY'
          import json, pathlib, sys
          gate, folder = sys.argv[1], pathlib.Path(sys.argv[2])
          report = json.loads((folder / 'candidate-report.json').read_text())
          result = {
              'gate_id': gate,
              'selected_task_id': report['selected_task_id'],
              'status': 'permanent-pre-score-failure',
              'predictions_committed': False,
              'hidden_scoring_performed': False,
              'sealed_outputs_accessed': False,
              'breakthrough_candidate': False,
          }
          (folder / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
            fi
            rm -rf "${out}"
          done

      - name: Verify no hidden outputs entered repository
        run: |
          if find lexigen-language-genesis/external/evidence/v11-campaign -type f \
            \( -iname '*sealed-output*' -o -iname '*hidden-output*' \) | grep -q .; then
            echo 'Hidden output filename detected' >&2
            exit 1
          fi

      - name: Commit pre-score evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lexigen-language-genesis/external/evidence/v11-campaign
          if git diff --cached --quiet; then
            echo 'No new evidence to commit'
          else
            git commit -m 'Preserve v11 campaign pre-score outcomes'
            git push origin HEAD:lexigen/external-arcgen-v11-campaign
          fi
