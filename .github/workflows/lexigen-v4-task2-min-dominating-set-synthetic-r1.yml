name: LEXIGEN v4 Task 2 Min Dominating Set Synthetic R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/02-min-dominating-set/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/02-min-dominating-set/requirements.txt
      - name: Verify immutable engine and selection locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify frozen Task 2 candidate and dependency blobs
        working-directory: lexigen-v4/tasks/02-min-dominating-set
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "candidates.py": "cc020a9733e9c55aa5524e84a3b6201fcefbb6fb",
              "requirements.txt": "6b6bc893815835562a66a5a98c79e0c087978969",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          print("LEXIGEN_V4_TASK2_CANDIDATES_R1_FROZEN")
          PY
      - name: Install frozen dependencies
        working-directory: lexigen-v4/tasks/02-min-dominating-set
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate every candidate against independent exhaustive oracle
        working-directory: lexigen-v4/tasks/02-min-dominating-set
        run: python -u validate_candidates.py
      - name: Upload complete synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task2-min-dominating-set-synthetic-r1
          path: lexigen-v4/tasks/02-min-dominating-set/synthetic-evidence/
          if-no-files-found: error
          retention-days: 90
