name: Mini-ORIGIN PySTreeD Native Holdout v0.51

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/pystreed_native_holdout_v51.py"
      - "mini-origin/tests/test_pystreed_native_holdout_v51.py"
      - ".github/workflows/mini-origin-v51-pystreed-native-holdout.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/pystreed_native_holdout_v51.py"
      - "mini-origin/tests/test_pystreed_native_holdout_v51.py"
      - ".github/workflows/mini-origin-v51-pystreed-native-holdout.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v51-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify hashed holdout protocol
        run: pytest -q tests/test_pystreed_native_holdout_v51.py
      - name: Clone pinned PySTreeD source
        run: |
          rm -rf results/v51
          mkdir -p results/v51
          git clone --filter=blob:none https://github.com/AlgTUDelft/pystreed.git results/v51/pystreed-source
          git -C results/v51/pystreed-source checkout 9ad41626a1f26c4b7481e8360c5c8b1871e10d96
          test "$(git -C results/v51/pystreed-source rev-parse HEAD)" = "9ad41626a1f26c4b7481e8360c5c8b1871e10d96"
      - name: Build and validate hashed implementation on native holdout
        run: >-
          python -m mini_origin.pystreed_native_holdout_v51
          --source results/v51/pystreed-source
          --work results/v51/work
          --output results/v51/pystreed-native-holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v51-pystreed-native-holdout
          path: |
            mini-origin/results/v51/pystreed-native-holdout.json
            mini-origin/results/v51/work/datasets
          if-no-files-found: warn
          retention-days: 90
