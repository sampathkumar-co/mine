name: Mini-ORIGIN PySTreeD Inline Fingerprint v0.52

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/pystreed_fingerprint_holdout_v52.py"
      - "mini-origin/tests/test_pystreed_fingerprint_holdout_v52.py"
      - ".github/workflows/mini-origin-v52-inline-fingerprint-holdout.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/pystreed_fingerprint_holdout_v52.py"
      - "mini-origin/tests/test_pystreed_fingerprint_holdout_v52.py"
      - ".github/workflows/mini-origin-v52-inline-fingerprint-holdout.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v52-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fingerprint-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify inline fingerprint protocol
        run: pytest -q tests/test_pystreed_fingerprint_holdout_v52.py
      - name: Clone pinned PySTreeD source
        run: |
          rm -rf results/v52
          mkdir -p results/v52
          git clone --filter=blob:none https://github.com/AlgTUDelft/pystreed.git results/v52/pystreed-source
          git -C results/v52/pystreed-source checkout 9ad41626a1f26c4b7481e8360c5c8b1871e10d96
          test "$(git -C results/v52/pystreed-source rev-parse HEAD)" = "9ad41626a1f26c4b7481e8360c5c8b1871e10d96"
      - name: Build and validate inline fingerprint on second native holdout
        run: >-
          python -m mini_origin.pystreed_fingerprint_holdout_v52
          --source results/v52/pystreed-source
          --work results/v52/work
          --output results/v52/pystreed-inline-fingerprint.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v52-inline-fingerprint
          path: |
            mini-origin/results/v52/pystreed-inline-fingerprint.json
            mini-origin/results/v52/work/datasets
          if-no-files-found: warn
          retention-days: 90
