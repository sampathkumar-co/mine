name: Mini-ORIGIN External Conditioned Lock v0.61

on:
  push:
    branches:
      - research/mini-origin-v61-external-conditioned-blind
    paths:
      - "mini-origin/src/mini_origin/external_conditioned_lock_v61.py"
      - ".github/workflows/mini-origin-v61-external-conditioned-lock.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/external_conditioned_lock_v61.py"
      - ".github/workflows/mini-origin-v61-external-conditioned-lock.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v61-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archive-hash-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Enforce hash-only source boundary
        run: >-
          python -c "from pathlib import Path; p=Path('src/mini_origin/external_conditioned_lock_v61.py').read_text(); forbidden=('zipfile','csv','pandas','numpy','make_task','decode('); assert not any(x in p for x in forbidden)"
      - name: Download archive bytes and freeze hashes
        run: >-
          mkdir -p results/v61-lock &&
          python -m mini_origin.external_conditioned_lock_v61
          --output results/v61-lock/archive-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v61-external-archive-lock
          path: mini-origin/results/v61-lock/archive-lock.json
          retention-days: 90
