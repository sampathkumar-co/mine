name: LEXIGEN v6 Task1 Blind Observer
on:
  push:
    branches: [lexigen/v6-task1-max-flow-min-cost-r1]
    paths: ["lexigen-v6/tasks/01-max-flow-min-cost/TRIGGER_OBSERVE_BLIND_R1"]
permissions:
  actions: read
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 437b2822758a2921169cda06de12a5c736afb8fc
      TARGET_WORKFLOW: LEXIGEN v6 Task1 Official Blind R1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lexigen/v6-task1-max-flow-min-cost-r1
      - name: Observe frozen blind run without changing it
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          target_sha=os.environ['TARGET_SHA']
          target_name=os.environ['TARGET_WORKFLOW']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'LEXIGEN-v6-blind-observer',
          }
          def get(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          observed=None
          for _ in range(180):
              q=urllib.parse.urlencode({'head_sha':target_sha,'per_page':100})
              data=get(f'https://api.github.com/repos/{repo}/actions/runs?{q}')
              matches=[r for r in data.get('workflow_runs',[]) if r.get('name')==target_name and r.get('event')=='push']
              if matches:
                  run=max(matches,key=lambda r:int(r['id']))
                  if run.get('status')=='completed':
                      arts=get(run['artifacts_url']).get('artifacts',[])
                      observed={
                          'campaign':'LEXIGEN v6 Applicability-Conditioned Causal Transfer Replication',
                          'task_index':1,
                          'task':'max_flow_min_cost',
                          'stage':'official_blind_r1_observation',
                          'target_head_sha':target_sha,
                          'run_id':run['id'],
                          'run_number':run.get('run_number'),
                          'event':run.get('event'),
                          'status':run.get('status'),
                          'conclusion':run.get('conclusion'),
                          'created_at':run.get('created_at'),
                          'updated_at':run.get('updated_at'),
                          'run_attempt':run.get('run_attempt'),
                          'artifacts':[
                              {
                                  'id':a['id'],
                                  'name':a['name'],
                                  'size_in_bytes':a['size_in_bytes'],
                                  'digest':a.get('digest'),
                                  'expired':a.get('expired'),
                              } for a in arts
                          ],
                          'observer_changed_blind_execution':False,
                          'observer_opened_benchmark_test_data':False,
                      }
                      break
              time.sleep(5)
          if observed is None:
              raise SystemExit('blind run did not complete within observer window')
          path=Path('lexigen-v6/tasks/01-max-flow-min-cost/BLIND_R1_OBSERVATION.json')
          path.write_text(json.dumps(observed,indent=2)+'\n')
          print(json.dumps(observed,indent=2))
          PY
      - name: Persist observation metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexigen-v6/tasks/01-max-flow-min-cost/BLIND_R1_OBSERVATION.json
          git commit -m "lexigen v6 task1: record blind run observation"
          git push origin HEAD:lexigen/v6-task1-max-flow-min-cost-r1
