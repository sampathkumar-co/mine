name: Mini-ORIGIN Audit v0.13

on:
  push:
    paths:
      - ".github/workflows/mini-origin-audit-v13.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.13 is complete; use workflow_dispatch to reproduce the Pareto audit."

  reproduce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [131, 132, 133]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_sketch_audit_v13.py
      - run: >-
          mkdir -p results &&
          python -m mini_origin.sketch_audit_v13
          --seed ${{ matrix.seed }}
          --output results/audit-v13-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-audit-v13-seed-${{ matrix.seed }}
          path: mini-origin/results/audit-v13-seed-${{ matrix.seed }}.json
          retention-days: 90
