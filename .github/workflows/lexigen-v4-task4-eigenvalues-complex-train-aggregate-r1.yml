name: LEXIGEN v4 Task 4 Eigenvalues Complex Train Aggregate R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/04-eigenvalues-complex/TRIGGER_TRAIN_AGGREGATE_R1"

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  aggregate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/04-eigenvalues-complex/requirements.txt
      - name: Verify immutable training evidence package
        working-directory: lexigen-v4/tasks/04-eigenvalues-complex
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
              "candidates.py": "efea5bda4bfbfa620fd65f551792d48bd619979e",
              "requirements.txt": "2c04913adbf4e70b866f8fb7bb603abef158bbda",
              "train_shard.py": "3ccfe9fa0c5a70475d71273c2396d972b8d34ab1",
              "aggregate_train.py": "99d03f7677405ef3bfb746bff9ea25735ae1cd1b",
              "METADATA_R1_RESULT.json": "9cece8aa58b8134edc1a7a921879a4f7e0cf20f4",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          failure = json.loads(Path("TRAIN_AGGREGATION_FAILURE_R1.json").read_text())
          if failure["training_workflow_run_id"] != 32643221594 or failure["training_shards_succeeded"] != 10:
              raise SystemExit("training aggregation provenance mismatch")
          print("LEXIGEN_V4_TASK4_TRAIN_AGGREGATE_ONLY_R1_FROZEN")
          PY
      - name: Install unchanged frozen dependencies needed by aggregator imports
        working-directory: lexigen-v4/tasks/04-eigenvalues-complex
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          repository: sampathkumar-co/mine
          run-id: 32643221594
          github-token: ${{ github.token }}
          pattern: lexigen-v4-task4-eigenvalues-complex-train-r1-shard-*
          path: lexigen-v4/tasks/04-eigenvalues-complex/training-downloaded
          merge-multiple: false
      - name: Aggregate original immutable training shards only
        working-directory: lexigen-v4/tasks/04-eigenvalues-complex
        run: python -u aggregate_train.py --input training-downloaded --output training-complete-evidence
      - name: Upload recovered complete training evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task4-eigenvalues-complex-training-r1-aggregate-recovered
          path: lexigen-v4/tasks/04-eigenvalues-complex/training-complete-evidence/
          if-no-files-found: error
          retention-days: 90
