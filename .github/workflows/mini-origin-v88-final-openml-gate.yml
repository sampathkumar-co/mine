name: Mini-ORIGIN Final Fresh OpenML Gate v0.88

on:
  push:
    branches:
      - research/mini-origin-v88-final-openml-gate
    paths:
      - "mini-origin/.v88-final-openml-trigger"

concurrency:
  group: mini-origin-v88-final-openml-gate
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  final-fresh-openml-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install frozen environment
        working-directory: mini-origin
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install openml==0.15.1
      - name: Verify frozen scientific boundary
        working-directory: mini-origin
        run: bash scripts/run_v88_preflight.sh
      - name: Download authoritative v0.86 exclusion registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/v86-registry /tmp/v86-registry.zip
          mkdir -p /tmp/v86-registry
          gh api repos/sampathkumar-co/mine/actions/artifacts/8784724372/zip > /tmp/v86-registry.zip
          echo "4a43c35b951c3ff276044fd837bd92d337f370fd6c869dc6f5b2f8fc840b57d3  /tmp/v86-registry.zip" | sha256sum -c -
          unzip -q /tmp/v86-registry.zip -d /tmp/v86-registry
          echo "f1b50e11ce23e4bdfa42e3575c08379dc99d8bd98bc15fd7d581a464865effe0  /tmp/v86-registry/registry.json" | sha256sum -c -
      - name: Hash-lock seven fresh OpenML datasets without parsing records
        working-directory: mini-origin
        run: |
          mkdir -p results/v88
          python -m mini_origin.openml_final_lock_v88 \
            --registry /tmp/v86-registry/registry.json \
            --output results/v88/manifest.json \
            2>&1 | tee results/v88/hash-lock.log
      - name: Run frozen v0.85 Python reference
        working-directory: mini-origin
        run: |
          python -m mini_origin.openml_final_blind_v88 reference \
            --manifest results/v88/manifest.json \
            --states results/v88/states.txt \
            --reference results/v88/python-reference.json \
            2>&1 | tee results/v88/reference.log
      - name: Compile and run independent Rust replay
        working-directory: mini-origin
        run: |
          rustc -C opt-level=3 -C debuginfo=0 \
            compiled/response_cost_lower_bound_v66.rs \
            -o results/v88/response_cost_lower_bound_v88
          results/v88/response_cost_lower_bound_v88 \
            --input results/v88/states.txt \
            --output results/v88/rust-results.json
      - name: Apply frozen final kill gate
        working-directory: mini-origin
        run: |
          set -o pipefail
          python -m mini_origin.openml_final_blind_v88 validate \
            --manifest results/v88/manifest.json \
            --reference results/v88/python-reference.json \
            --rust results/v88/rust-results.json \
            --output results/v88/evidence.json \
            2>&1 | tee results/v88/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v88-final-openml-gate
          path: mini-origin/results/v88
          if-no-files-found: warn
          retention-days: 90
