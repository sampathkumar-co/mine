name: Mini-ORIGIN Clean Lower-Bound Schema v0.68

on:
  push:
    branches:
      - research/mini-origin-v68-clean-lower-bound-lock
    paths:
      - "mini-origin/external-data/uci-v68/manifest.json"
      - "mini-origin/src/mini_origin/clean_lower_bound_schema_v68.py"
      - ".github/workflows/mini-origin-v68-clean-lower-bound-schema.yml"
  pull_request:
    paths:
      - "mini-origin/external-data/uci-v68/manifest.json"
      - "mini-origin/src/mini_origin/clean_lower_bound_schema_v68.py"
      - ".github/workflows/mini-origin-v68-clean-lower-bound-schema.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v68-schema-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-lower-bound-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen lock and schema-only boundary
        run: >-
          python -c "import ast,json,pathlib; m=json.load(open('external-data/uci-v68/manifest.json')); assert m['lock_digest']=='c599849c7ba26fdb3e241221dcae3d3feb26d47ad217da53f0d06b97ebc1e02b'; tree=ast.parse(pathlib.Path('src/mini_origin/clean_lower_bound_schema_v68.py').read_text()); names=set(); [(names.add(a.name),names.add(a.name.rsplit('.',1)[-1])) for n in ast.walk(tree) if isinstance(n,ast.Import) for a in n.names]; [(names.add(n.module or ''),names.add((n.module or '').rsplit('.',1)[-1]),*[(names.add(a.name),names.add(((n.module+'.') if n.module else '')+a.name)) for a in n.names]) for n in ast.walk(tree) if isinstance(n,ast.ImportFrom)]; forbidden={'conditioned_cell_frontier_v60','response_cost_pareto_v56','response_cost_lower_bound_v65','lower_bound_export_v66'}; assert not (forbidden & names), sorted(forbidden & names)"
      - name: Open hash-locked archives for schema inventory only
        run: >-
          mkdir -p results/v68-schema &&
          python -m mini_origin.clean_lower_bound_schema_v68
          --output results/v68-schema/schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v68-clean-lower-bound-schema
          path: mini-origin/results/v68-schema/schema.json
          retention-days: 90
