name: LEXIGEN Task 5 Log Forensics

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-forensics/TRIGGER_TASK5_LOG_FORENSICS"

permissions:
  actions: read
  contents: read

jobs:
  extract-log-tails:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable failed-job logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p lexigen-forensics/output
          for job in 90264020646 90264020765; do
            curl --fail --location --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/actions/jobs/${job}/logs" \
              -o "lexigen-forensics/output/job-${job}.log"
            tail -n 120 "lexigen-forensics/output/job-${job}.log" \
              > "lexigen-forensics/output/job-${job}-tail.log"
            sha256sum "lexigen-forensics/output/job-${job}.log" \
              >> lexigen-forensics/output/log-sha256.txt
          done
      - name: Upload read-only forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-task5-failed-job-forensics
          path: lexigen-forensics/output/
          if-no-files-found: error
          retention-days: 90
