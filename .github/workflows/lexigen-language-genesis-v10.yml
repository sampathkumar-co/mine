name: Lexigen Language Genesis v10

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/v10/**"
      - "lexigen-language-genesis/external/arcgen_gate_v10.py"
      - ".github/workflows/lexigen-language-genesis-v10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-machine-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen v10 branch
        uses: actions/checkout@v4
        with:
          path: current
      - name: Check out gate-8 redacted evidence only
        uses: actions/checkout@v4
        with:
          ref: lexigen/external-arcgen-gate8
          path: gate8
      - name: Check out pinned ARC-GEN source
        uses: actions/checkout@v4
        with:
          repository: google/ARC-GEN
          ref: a15cbdb44c776610aeeb9f487a06af875d3d0878
          path: arcgen
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Run v10 tests
        working-directory: current/lexigen-language-genesis/v10
        run: python -m pytest -q
      - name: Validate sealed adapter
        working-directory: current/lexigen-language-genesis/external
        run: python -m py_compile arcgen_gate_v10.py
      - name: Reproduce v10 mechanism gate
        working-directory: current/lexigen-language-genesis/v10
        run: |
          python replay_gate8_v10.py \
            --redacted ../../../gate8/lexigen-language-genesis/external/evidence/arcgen-gate8/redacted-task.json \
            --arcgen-root ../../../arcgen \
            --output-dir artifacts/v10
      - name: Hash evidence
        working-directory: current/lexigen-language-genesis/v10
        run: sha256sum artifacts/v10/*.json | tee artifacts/v10/SHA256SUMS
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-language-genesis-v10-${{ github.sha }}
          path: current/lexigen-language-genesis/v10/artifacts/v10/
          if-no-files-found: error
          retention-days: 90
