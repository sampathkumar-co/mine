name: Mini-ORIGIN OpenML Cross-Source Lock v0.77

on:
  push:
    branches: [research/mini-origin-v77-openml-cross-source-lock]
    paths:
      - "mini-origin/campaigns/v77-openml-cross-source-lock.json"
      - "mini-origin/src/mini_origin/openml_cross_source_lock_v77.py"
      - "mini-origin/tests/test_openml_cross_source_lock_v77.py"
      - ".github/workflows/mini-origin-v77-openml-cross-source-lock.yml"
      - "research-evidence/mini-origin-v76-openml-preblind-registry.json"
  pull_request:
    paths:
      - "mini-origin/campaigns/v77-openml-cross-source-lock.json"
      - "mini-origin/src/mini_origin/openml_cross_source_lock_v77.py"
      - "mini-origin/tests/test_openml_cross_source_lock_v77.py"
      - ".github/workflows/mini-origin-v77-openml-cross-source-lock.yml"
      - "research-evidence/mini-origin-v76-openml-preblind-registry.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openml-cross-source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify immutable parents and protocol
        run: >-
          python -c "import json; r=json.load(open('../research-evidence/mini-origin-v76-openml-preblind-registry.json')); p=json.load(open('campaigns/v77-openml-cross-source-lock.json')); assert r['registry_digest']==p['parent_v76_registry_digest']=='d312c4f0b853237479d6be8a74b6bf47776722d7aea1ce00c7b9745be90d57d2'; assert r['parent_v75_evidence_digest']==p['parent_v75_evidence_digest']=='db379850b2a517e16d5ea442047ac4933ad06fdcf4d6838d91fc36d72e75bc47'; assert p['dataset_count']==7 and p['suite']['suite_id']==99"
      - name: Enforce hash-only source boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('src/mini_origin/openml_cross_source_lock_v77.py')
          tree=ast.parse(path.read_text())
          forbidden_imports={'numpy','pandas','scipy','sklearn','arff','liac_arff','csv'}
          imports=set()
          calls=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Import): imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module: imports.add(node.module.split('.')[0])
              elif isinstance(node,ast.Call):
                  target=node.func
                  if isinstance(target,ast.Name): calls.add(target.id)
                  elif isinstance(target,ast.Attribute): calls.add(target.attr)
          assert not (imports & forbidden_imports), imports & forbidden_imports
          assert not (calls & {'read_csv','loadarff','loads','iter_rows','parse_records','select_states'}), calls
          PY
      - name: Run focused boundary tests
        run: pytest -q tests/test_openml_cross_source_lock_v77.py
      - name: Hash-lock deterministic OpenML bytes
        run: python -m mini_origin.openml_cross_source_lock_v77 --output results/v77/openml-cross-source-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v77-openml-cross-source-lock
          path: mini-origin/results/v77/openml-cross-source-lock.json
          if-no-files-found: error
          retention-days: 90
