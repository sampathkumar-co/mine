name: LEXIGEN v4 Task 6 Unit Simplex Projection Synthetic R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/06-unit-simplex-projection/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/06-unit-simplex-projection/requirements.txt
      - name: Verify immutable campaign locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify frozen Task 6 synthetic package
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock = json.loads(Path("SYNTHETIC_R1_LOCK.json").read_text())
          for name, wanted in lock["git_blob_sha1"].items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          if lock["candidate_count"] != 28 or lock["synthetic_cases"] != 10 or lock["expected_checks"] != 280:
              raise SystemExit("synthetic budget lock mismatch")
          if any([
              lock["official_training_manifest_opened_before_lock"],
              lock["official_training_payloads_opened_before_lock"],
              lock["official_test_manifest_opened_before_lock"],
              lock["official_test_payloads_opened_before_lock"],
          ]):
              raise SystemExit("pretraining boundary lock violated")
          print("LEXIGEN_V4_TASK6_SYNTHETIC_R1_PACKAGE_FROZEN")
          PY
      - name: Install frozen dependency
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: pip install -r requirements.txt
      - name: Execute independent exhaustive KKT oracle
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: python -u synthetic_validate.py --output synthetic-evidence
      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task6-unit-simplex-projection-synthetic-r1
          path: lexigen-v4/tasks/06-unit-simplex-projection/synthetic-evidence/
          if-no-files-found: error
          retention-days: 90
