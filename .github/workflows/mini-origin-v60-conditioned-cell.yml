name: Mini-ORIGIN Conditioned Cell Frontier v0.60

on:
  push:
    branches:
      - research/mini-origin-v60-conditioned-cell-frontier
    paths:
      - "mini-origin/src/mini_origin/conditioned_cell_frontier_v60.py"
      - ".github/workflows/mini-origin-v60-conditioned-cell.yml"
      - "mini-origin/external-data/uci-v58/manifest.json"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/conditioned_cell_frontier_v60.py"
      - ".github/workflows/mini-origin-v60-conditioned-cell.yml"
      - "mini-origin/external-data/uci-v58/manifest.json"
  workflow_dispatch:

concurrency:
  group: mini-origin-v60-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conditioned-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify preserved v0.59 rejection
        run: >-
          python -c "import json; r=json.load(open('../research-evidence/mini-origin-v59-structural-subtable-rejected.json')); assert not r['development_gate']; assert r['frozen_frontier_digest']=='4333b3992668ff9b802ee3829258f23fa1450a82e90070df2b1f623707786604'"
      - name: Run frozen conditioned-cell development gate
        run: >-
          mkdir -p results/v60 &&
          python -m mini_origin.conditioned_cell_frontier_v60
          --output results/v60/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v60-conditioned-cell
          path: mini-origin/results/v60/evidence.json
          retention-days: 90
