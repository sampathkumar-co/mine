name: Mini-ORIGIN Medium Small-Query Coverage v0.83

on:
  push:
    branches:
      - research/mini-origin-v83-medium-small-query-coverage
    paths:
      - "mini-origin/campaigns/v83-medium-small-query-coverage.json"
      - "mini-origin/src/mini_origin/medium_small_query_coverage_v83.py"
      - "mini-origin/tests/test_medium_small_query_coverage_v83.py"
      - "mini-origin/scripts/run_v83_ci.sh"
      - ".github/workflows/mini-origin-v83-medium-small-query-coverage.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v83-medium-small-query-coverage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  opened-data-development:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Run opened-data v0.83 campaign
        run: bash scripts/run_v83_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v83-medium-small-query-coverage
          path: |
            mini-origin/results/v83/states.txt
            mini-origin/results/v83/python-reference.json
            mini-origin/results/v83/rust-results.json
            mini-origin/results/v83/evidence.json
            mini-origin/results/v83/adapted-manifest.json
          if-no-files-found: warn
          retention-days: 90
