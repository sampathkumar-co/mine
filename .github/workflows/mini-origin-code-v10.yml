name: Mini-ORIGIN Code v0.10

on:
  push:
    paths:
      - ".github/workflows/mini-origin-code-v10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.10 is complete; use workflow_dispatch to reproduce the sparse-code study."

  reproduce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 102, 103]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_coded_memory_v10.py
      - run: >-
          mkdir -p results &&
          python -m mini_origin.coded_memory_v10
          --seed ${{ matrix.seed }}
          --output results/code-v10-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-code-v10-seed-${{ matrix.seed }}
          path: mini-origin/results/code-v10-seed-${{ matrix.seed }}.json
          retention-days: 90
