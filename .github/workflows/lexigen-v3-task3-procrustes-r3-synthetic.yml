name: LEXIGEN v3 Procrustes R3 Subspace Synthetic

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v3/task3-procrustes-r3/TRIGGER_SYNTHETIC"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v3/task3-procrustes-r3/requirements.txt
      - name: Verify frozen final candidate family
        working-directory: lexigen-v3/task3-procrustes-r3
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "8f464fb70616f602a23d726ccfa122d681b891b2"
          data = Path("candidates.py").read_bytes()
          actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if actual != expected:
              raise SystemExit(f"candidate blob mismatch: {actual} != {expected}")
          print("LEXIGEN_V3_PROCRUSTES_R3_FROZEN")
          PY
      - name: Install frozen dependencies
        working-directory: lexigen-v3/task3-procrustes-r3
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate final low-subspace refinement
        working-directory: lexigen-v3/task3-procrustes-r3
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u synthetic_validate.py
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v3-procrustes-r3-synthetic-evidence
          path: lexigen-v3/task3-procrustes-r3/synthetic-result.json
          if-no-files-found: error
          retention-days: 90
