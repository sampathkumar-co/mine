name: LEXIGEN v3 Task 3 Procrustes R2 Synthetic

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v3/task3-procrustes-r2/TRIGGER_SYNTHETIC"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v3/task3-procrustes-r2/requirements.txt
      - name: Verify frozen revision 2 candidate family
        working-directory: lexigen-v3/task3-procrustes-r2
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "a03cf6117291bff8169fe3c7d57531581b31ddf8"
          data = Path("candidates.py").read_bytes()
          actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if actual != expected:
              raise SystemExit(f"candidate blob mismatch: {actual} != {expected}")
          print("LEXIGEN_V3_PROCRUSTES_R2_FROZEN")
          PY
      - name: Install frozen dependencies
        working-directory: lexigen-v3/task3-procrustes-r2
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run synthetic exactness and transfer diagnostics
        working-directory: lexigen-v3/task3-procrustes-r2
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -u synthetic_validate.py
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v3-procrustes-r2-synthetic-evidence
          path: lexigen-v3/task3-procrustes-r2/synthetic-result.json
          if-no-files-found: error
          retention-days: 90
