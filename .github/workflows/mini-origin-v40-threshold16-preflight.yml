name: Mini-ORIGIN v0.40 Threshold-16 Preflight

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/local_quotient_preflight_v40.py"
      - ".github/workflows/mini-origin-v40-threshold16-preflight.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v40-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Run bounded local quotient preflight
        run: >-
          mkdir -p results &&
          python -m mini_origin.local_quotient_preflight_v40
          --output results/v40-threshold16-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v40-threshold16-preflight
          path: mini-origin/results/v40-threshold16-preflight.json
          retention-days: 30
