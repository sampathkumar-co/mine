name: LEXIGEN v4 Locked Holdout Selection Layout v2

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/TRIGGER_SELECT_HOLDOUTS_LAYOUT_V2"

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile locked engine and amended metadata enumerator
        working-directory: lexigen-v4
        run: python -m compileall -q engine.py engine_v2.py engine_v3.py engine_v4.py selector.py select_holdouts.py select_holdouts_layout_v2.py verify_engine_lock.py
      - name: Verify original immutable engine lock
        working-directory: lexigen-v4
        run: python -u verify_engine_lock.py
      - name: Select holdouts using frozen-layout path metadata only
        working-directory: lexigen-v4
        run: python -u select_holdouts_layout_v2.py
      - name: Upload immutable selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-holdout-selection-layout-v2
          path: lexigen-v4/selection-evidence-layout-v2/
          if-no-files-found: error
          retention-days: 90
