name: LEXIGEN OMEGA R4 Candidate Materialization
on:
  pull_request:
    branches: [lexigen/v7-gso-tasks2-6-proposals-r1]
    paths: ["lexigen-omega/TRIGGER_R4_MATERIALIZE"]
permissions: {contents: read}
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify pre-execution R4 identities
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected = {
            'proposal': ('lexigen-omega/evidence/PROSPECTIVE_R4_SOURCE_PROPOSALS.json', '95012e5d3643987c40ed30fd6cd9c125cd767257'),
            'contract_manifest': ('lexigen-omega/evidence/PROSPECTIVE_R4_EXECUTION_CONTRACT_MANIFEST.json', '6c5af3c710357dafb8792d4ed9540b5b84ec35de'),
            'builder': ('lexigen-omega/tools/build_r4_candidates.py', 'b8d3894c9ba176b1ccf6a74e5fee03dcf119df6d'),
            'prediction': ('lexigen-omega/evidence/PROSPECTIVE_R4_TRANSFER_PREDICTION.json', '3bb0d9cca347e7751b56b4c934e210ac18448e4d'),
            'scorer': ('lexigen-omega/tools/score_prospective_exact_sequence.py', 'e870a4c5fb6dc1d9cc4cb28ce265e86d11e8f08f'),
          }
          for label, (path, want) in expected.items():
              got = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if got != want:
                  raise SystemExit(f'{label} drift: {got} != {want}')
          m = json.loads(Path(expected['contract_manifest'][0]).read_text())
          assert m['candidate_execution_count_before_manifest'] == 0
          assert m['candidate_timing_accessed_before_manifest'] is False
          assert m['candidate_outcome_accessed_before_manifest'] is False
          assert m['R5_source_accessed'] is False
          PY
      - name: Compile deterministic R4 materializer
        run: python -m py_compile lexigen-omega/tools/build_r4_candidates.py
      - name: Pull frozen GSO image and recover only base target file
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="slimshetty/gso:gso.eval.x86_64.huggingface__datasets-ef3b5dd"
          docker pull "$IMAGE"
          C=$(docker create "$IMAGE" true)
          mkdir -p base/src/datasets
          docker cp "$C:/testbed/src/datasets/load.py" base/src/datasets/load.py
          docker rm "$C"
          test "$(git hash-object base/src/datasets/load.py)" = "13562ec82b01898334b2eaa455f4ce38bb7176da"
      - name: Materialize all nine frozen candidates without execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          candidates = ['F1','F2','F4','N1','N3','N6','R1','R3','R6']
          target = Path('src/datasets/load.py')
          out = Path('materialized'); out.mkdir()
          rows = []
          for cid in candidates:
              root = Path('work') / cid
              dest = root / target
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(Path('base') / target, dest)
              c_out = out / cid
              subprocess.run([
                  'python','lexigen-omega/tools/build_r4_candidates.py',
                  '--candidate',cid,'--root',str(root),'--output',str(c_out)
              ], check=True)
              rows.append(json.loads((c_out / f'R4-{cid}.json').read_text()))
          payload = {
              'project':'LEXIGEN OMEGA',
              'stage':'R4_all_candidates_materialized_before_execution',
              'instance_id':'huggingface__datasets-ef3b5dd',
              'candidate_count':len(rows),
              'candidate_results':rows,
              'candidate_execution_count':0,
              'candidate_timing_observed':False,
              'candidate_outcome_observed':False,
              'expert_opt_commit_accessed':False,
              'expert_diff_accessed':False,
              'hints_accessed':False,
              'R5_source_accessed':False,
              'status':'materialization_complete_no_execution'
          }
          (out/'R4_MATERIALIZATION_RESULT.json').write_text(json.dumps(payload, indent=2, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-omega-r4-materialized
          path: materialized/
          if-no-files-found: error
          retention-days: 90
