name: LEXIGEN v6 Task 2 ODR Dataset Metadata R1
on:
  pull_request:
    branches: [lexigen/v6-preregister-result-r1]
    paths: ["lexigen-v6/tasks/02-odr/TRIGGER_METADATA_R1"]
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen metadata package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/02-odr/DATASET_METADATA_R1_LOCK.json').read_text())
          for k,p in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=lock['git_blob_sha1'][k]:raise SystemExit(f'metadata lock mismatch {k}')
          if lock['train_manifest_opened_before_lock'] or lock['test_manifest_opened_before_lock'] or lock['payloads_opened_before_lock']:
              raise SystemExit('dataset boundary crossed')
          PY
      - run: python -m py_compile lexigen-v6/tasks/02-odr/dataset_metadata.py
      - name: Read dataset directory metadata only
        run: python lexigen-v6/tasks/02-odr/dataset_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task2-odr-metadata-r1
          path: dataset-metadata.json
          if-no-files-found: error
          retention-days: 90
