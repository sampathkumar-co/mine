name: LEXIGEN v6 Task 2 ODR Synthetic R1
on:
  pull_request:
    branches: [lexigen/v6-preregister-result-r1]
    paths: ["lexigen-v6/tasks/02-odr/TRIGGER_SYNTHETIC_R1"]
permissions: {contents: read}
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen synthetic package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/02-odr/SYNTHETIC_R1_LOCK.json').read_text())
          for k,p in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              if got!=lock['git_blob_sha1'][k]: raise SystemExit(f'lock mismatch {k}: {got}')
          if lock['official_train_manifest_opened_before_lock'] or lock['official_test_manifest_opened_before_lock'] or lock['public_task_specific_solvers_opened_before_lock']:
              raise SystemExit('synthetic boundary crossed')
          PY
      - run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.5.2 scipy==1.17.0
      - name: Fetch exact frozen task source
        shell: bash
        run: |
          curl -L --fail --retry 3 -A 'LEXIGEN-v6-task2-synthetic-r1' -o task-source.py 'https://raw.githubusercontent.com/oripress/AlgoTune/dff9914c10800c7a031c9e8c3d4d1c8cd1b38906/AlgoTuneTasks/odr/odr.py'
          python - <<'PY'
          import hashlib
          b=open('task-source.py','rb').read()
          assert hashlib.sha256(b).hexdigest()=='076efd6697175397912d5d8e3bc1b121ba7461db3fdbf04263fa6d57f81eb68c'
          PY
      - run: python -m py_compile lexigen-v6/tasks/02-odr/candidates.py lexigen-v6/tasks/02-odr/synthetic.py lexigen-v5/engine.py
      - name: Execute independent synthetic screen
        run: python lexigen-v6/tasks/02-odr/synthetic.py task-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task2-odr-synthetic-r1
          path: |
            synthetic-summary.json
            synthetic-results.jsonl
            synthetic-candidate-plan.json
          if-no-files-found: error
          retention-days: 90
