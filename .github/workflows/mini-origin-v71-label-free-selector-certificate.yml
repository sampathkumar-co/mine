name: Mini-ORIGIN Label-Free Selector Certificate v0.71

on:
  push:
    branches:
      - research/mini-origin-v71-label-free-selector-certificate
    paths:
      - "mini-origin/campaigns/v71-label-free-selector-certificate.json"
      - "mini-origin/src/mini_origin/label_free_selector_certificate_v71.py"
      - "mini-origin/tests/test_label_free_selector_v71.py"
      - ".github/workflows/mini-origin-v71-label-free-selector-certificate.yml"
  pull_request:
    paths:
      - "mini-origin/campaigns/v71-label-free-selector-certificate.json"
      - "mini-origin/src/mini_origin/label_free_selector_certificate_v71.py"
      - "mini-origin/tests/test_label_free_selector_v71.py"
      - ".github/workflows/mini-origin-v71-label-free-selector-certificate.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v71-label-free-selector-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label-free-selector-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen parent and no solver execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("campaigns/v71-label-free-selector-certificate.json").read_text())
          assert row["parent_v70_commit"] == "c35bcd68d91b988d69b5f8192473f6aadb02a22b"
          assert row["protocol"]["solver_execution"] is False
          assert row["protocol"]["external_archive_access"] is False
          assert row["protocol"]["synthetic_task_count"] == 64
          PY
      - name: Run focused metamorphic tests
        run: pytest -q tests/test_label_free_selector_v71.py
      - name: Run frozen label-independence certificate
        run: >-
          mkdir -p results/v71 &&
          python -m mini_origin.label_free_selector_certificate_v71
          --output results/v71/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v71-label-free-selector-certificate
          path: mini-origin/results/v71/evidence.json
          if-no-files-found: warn
          retention-days: 90
