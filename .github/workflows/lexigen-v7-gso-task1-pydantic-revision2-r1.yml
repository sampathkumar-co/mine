name: LEXIGEN V7 GSO Task1 Pydantic Revision2 R1
on:
  pull_request:
    branches: [lexigen/v7-gso-task1-pydantic-revision1-result-r1]
    paths: ["lexigen-v7-gso/tasks/01-pydantic-setattr/TRIGGER_REVISION2_R1"]
permissions: {contents: read}
jobs:
  revision2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen Task 1 revision2 lock
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-gso/tasks/01-pydantic-setattr/REVISION2_LOCK_R1.json').read_text())
          paths={
            'REVISION2_PLAN_R1.json':'lexigen-v7-gso/tasks/01-pydantic-setattr/REVISION2_PLAN_R1.json',
            'REVISION1_R1_RESULT.json':'lexigen-v7-gso/tasks/01-pydantic-setattr/REVISION1_R1_RESULT.json',
            'PROPOSALS_R1.json':'lexigen-v7-gso/tasks/01-pydantic-setattr/PROPOSALS_R1.json',
            'build_candidate.py':'lexigen-v7-gso/tasks/01-pydantic-setattr/build_candidate.py',
            'run_revision2_feedback_r1.py':'lexigen-v7-gso/tasks/01-pydantic-setattr/run_revision2_feedback_r1.py',
            'extract_preflight_tests_r3.py':'lexigen-v7-gso/tasks/01-pydantic-setattr/extract_preflight_tests_r3.py',
            'GENERATION_CONTRACT_R1.md':'lexigen-v7-gso/GENERATION_CONTRACT_R1.md',
            'workflow':'.github/workflows/lexigen-v7-gso-task1-pydantic-revision2-r1.yml',
          }
          for key,path in paths.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=lock['git_blob_sha1'][key]: raise SystemExit(f'revision2 lock mismatch {key}: {got}')
          forbidden=['revision2_executed_before_lock','selected_candidates_changed_after_lock','new_mechanism_added_after_feedback','expert_target_timing_accessed_before_lock','expert_opt_commit_accessed_before_lock','expert_diff_accessed_before_lock','hints_accessed_before_lock']
          if any(lock.get(k) for k in forbidden): raise SystemExit('Task1 revision2 boundary crossed')
          PY
      - name: Install frozen test-extractor dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.4.1
      - name: Compile frozen Task1 revision2 code
        run: python -m py_compile lexigen-v7-gso/tasks/01-pydantic-setattr/build_candidate.py lexigen-v7-gso/tasks/01-pydantic-setattr/run_revision2_feedback_r1.py lexigen-v7-gso/tasks/01-pydantic-setattr/extract_preflight_tests_r3.py
      - name: Recover and verify all frozen Task1 tests
        run: python lexigen-v7-gso/tasks/01-pydantic-setattr/extract_preflight_tests_r3.py --output frozen-task-tests
      - name: Execute equal-budget final revision slot2 feedback
        run: |
          python lexigen-v7-gso/tasks/01-pydantic-setattr/run_revision2_feedback_r1.py \
            --builder lexigen-v7-gso/tasks/01-pydantic-setattr/build_candidate.py \
            --tests-dir frozen-task-tests \
            --output revision2-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v7-gso-task1-pydantic-revision2-r1
          path: revision2-evidence/
          if-no-files-found: error
          retention-days: 90
