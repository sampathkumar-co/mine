name: LEXIGEN v5 Task 9 Least Squares Dataset Metadata R1
on:
  pull_request:
    branches: [lexigen/v5-task8-kernel-density-estimation-result-r1]
    paths: ["lexigen-v5/tasks/09-least-squares/TRIGGER_DATASET_METADATA_R1"]
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify sealed synthetic evidence before metadata access
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/tasks/09-least-squares/DATASET_METADATA_R1_LOCK.json').read_text())
          paths={'SYNTHETIC_R1_RESULT.json':'lexigen-v5/tasks/09-least-squares/SYNTHETIC_R1_RESULT.json','inspect_dataset_metadata.py':'lexigen-v5/tasks/09-least-squares/inspect_dataset_metadata.py','workflow':'.github/workflows/lexigen-v5-task9-least-squares-dataset-metadata-r1.yml'}
          for k,p in paths.items():
            if subprocess.check_output(['git','hash-object',p],text=True).strip()!=lock['git_blob_sha1'][k]:raise SystemExit(f'Task9 metadata lock mismatch {k}')
          if lock['training_manifest_opened_before_lock'] or lock['test_manifest_opened_before_lock']:raise SystemExit('manifest boundary crossed')
          PY
      - name: Compile metadata-only inspector
        run: python -m py_compile lexigen-v5/tasks/09-least-squares/inspect_dataset_metadata.py
      - name: Inspect Hugging Face tree metadata only
        run: python lexigen-v5/tasks/09-least-squares/inspect_dataset_metadata.py --output dataset-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task9-least-squares-dataset-metadata-r1
          path: dataset-metadata.json
          if-no-files-found: error
          retention-days: 90
