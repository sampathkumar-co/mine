name: Mini-ORIGIN Successor Normal Form v0.59

on:
  push:
    branches:
      - research/mini-origin-v59-successor-normal-form
    paths:
      - "mini-origin/src/mini_origin/successor_normal_form_v59.py"
      - ".github/workflows/mini-origin-v59-successor-normal-form.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/successor_normal_form_v59.py"
      - ".github/workflows/mini-origin-v59-successor-normal-form.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v59-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  successor-normal-form:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify preserved v0.58 rejection
        run: >-
          python -c "import json; p=json.load(open('../research-evidence/mini-origin-v58-history-availability-rejected.json')); assert p['status']=='rejected'; assert not p['development_gate']; assert p['quotient_only_solved_count']==5; assert p['expansion_ratio_lower_bound_p90'] < 8.0"
      - name: Run recursive successor normal-form experiment
        run: >-
          mkdir -p results/v59 &&
          python -m mini_origin.successor_normal_form_v59
          --output results/v59/successor-normal-form.json
      - name: Enforce preregistered gate
        run: >-
          python -c "import json; p=json.load(open('results/v59/successor-normal-form.json')); assert p['development_gate'], json.dumps({k:p.get(k) for k in ('status','quotient_solved_count','plain_solved_count','quotient_only_solved_count','strict_v58_unsolved_recovered_count','expansion_ratio_lower_bound_median','expansion_ratio_lower_bound_p90','budget_ladder_results')}, indent=2)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v59-successor-normal-form
          path: mini-origin/results/v59/successor-normal-form.json
          retention-days: 90
