name: Mini-ORIGIN Fresh External Evaluation v0.75

on:
  push:
    branches:
      - research/mini-origin-v75-fresh-external-evaluation
    paths:
      - "mini-origin/campaigns/v75-fresh-external-evaluation.json"
      - "mini-origin/external-data/uci-v75/manifest.json"
      - "mini-origin/src/mini_origin/fresh_external_evaluation_v75.py"
      - "mini-origin/src/mini_origin/fresh_external_run_v75.py"
      - ".github/workflows/mini-origin-v75-fresh-external-evaluation.yml"
  pull_request:
    paths:
      - "mini-origin/campaigns/v75-fresh-external-evaluation.json"
      - "mini-origin/external-data/uci-v75/manifest.json"
      - "mini-origin/src/mini_origin/fresh_external_evaluation_v75.py"
      - "mini-origin/src/mini_origin/fresh_external_run_v75.py"
      - ".github/workflows/mini-origin-v75-fresh-external-evaluation.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v75-fresh-external-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fresh-external-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen parents, lock and gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('campaigns/v75-fresh-external-evaluation.json'))
          m=json.load(open('external-data/uci-v75/manifest.json'))
          e=json.load(open('../research-evidence/mini-origin-v72-label-free-frontier-pass.json'))
          assert p['status']=='preregistered_before_record_parsing'
          assert p['parent_v74_lock_digest']==m['lock_digest']=='6730d5029294a753236f77cef1be1334885a5e8cc8d114a285637987eae5fbaf'
          assert p['parent_v72_evidence_digest']==m['parent_v72_evidence_digest']==e['evidence_digest']=='b1fc70852a2ad35d91972889eb853856cde18bca0ed02db37cd37ac333639090'
          assert e['development_gate'] is True
          assert [d['uci_id'] for d in m['datasets']]==p['datasets']
          assert len(m['datasets'])==7
          assert p['locked_gate']['contributing_datasets']==7
          assert p['locked_gate']['minimum_base_states']==60
          assert p['locked_gate']['minimum_profiled_states']==180
          assert p['locked_gate']['minimum_median_plain_bounded_ratio']==10.0
          assert p['locked_gate']['minimum_p90_plain_bounded_ratio']==30.0
          print('frozen-v75-protocol-ok')
          PY
          git diff --exit-code dae02829efc4819935a4ec87c31ea5eee3305d83 -- \
            src/mini_origin/label_free_frontier_v72.py \
            src/mini_origin/numeric_threshold_frontier_v70.py \
            src/mini_origin/label_free_selector_certificate_v71.py \
            src/mini_origin/conditioned_cell_frontier_v60.py \
            src/mini_origin/response_cost_pareto_v56.py \
            src/mini_origin/response_cost_lower_bound_v65.py \
            compiled/response_cost_lower_bound_v66.rs
      - name: Verify all seven locked CSV adapters
        run: |
          python - <<'PY'
          import hashlib, json
          from mini_origin import fresh_external_evaluation_v75 as e
          p,m=e.configure()
          rows=[]
          for d in m['datasets']:
              raw=e.opened.download(d['url'])
              assert hashlib.sha256(raw).hexdigest()==d['sha256']
              assert len(raw)==d['bytes']
              parsed=e.parse_csv(d['name'],raw)
              rows.append((d['name'],len(parsed),len(parsed[0][0]),len({label for _,label in parsed})))
          print(json.dumps(rows,indent=2))
          PY
      - name: Compute frozen Python exact reference
        run: |
          mkdir -p results/v75
          python -m mini_origin.fresh_external_run_v75 reference \
            --states results/v75/states.txt \
            --reference results/v75/python-reference.json
      - name: Compile independent Rust solver
        run: rustc -C opt-level=3 -C debuginfo=0 compiled/response_cost_lower_bound_v66.rs -o results/v75/response_cost_lower_bound_v75
      - name: Run independent Rust replay
        run: results/v75/response_cost_lower_bound_v75 --input results/v75/states.txt --output results/v75/rust-results.json
      - name: Apply unchanged preregistered gate
        run: |
          python -m mini_origin.fresh_external_run_v75 validate \
            --reference results/v75/python-reference.json \
            --rust results/v75/rust-results.json \
            --output results/v75/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v75-fresh-external-evaluation
          path: |
            mini-origin/results/v75/python-reference.json
            mini-origin/results/v75/rust-results.json
            mini-origin/results/v75/evidence.json
          if-no-files-found: warn
          retention-days: 90
