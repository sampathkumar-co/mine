name: LEXIGEN v4 Locked Selection Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/TRIGGER_DIAGNOSE_SELECTION_R1"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile unchanged locked selector and diagnostic wrapper
        working-directory: lexigen-v4
        run: python -m compileall -q engine.py engine_v2.py engine_v3.py engine_v4.py selector.py select_holdouts.py verify_engine_lock.py diagnose_selection.py
      - name: Verify original immutable engine lock
        working-directory: lexigen-v4
        run: python -u verify_engine_lock.py
      - name: Invoke unchanged selector with redacted failure preservation
        working-directory: lexigen-v4
        run: python -u diagnose_selection.py
      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-selection-diagnostic-r1
          path: |
            lexigen-v4/selection-diagnostic-evidence/
            lexigen-v4/selection-evidence/
          if-no-files-found: error
          retention-days: 90
