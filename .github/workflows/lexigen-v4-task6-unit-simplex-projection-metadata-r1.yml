name: LEXIGEN v4 Task 6 Unit Simplex Projection Metadata R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/06-unit-simplex-projection/TRIGGER_METADATA_R1"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable campaign locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify frozen Task 6 metadata package
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
              "TASK_START.json": "6b5942713d7b1e113cc5cf525d109fed519a6895",
              "SOURCE_ANALYSIS_RESULT.json": "5ca25894b2af6097f5b14813e961a8cacb44f135",
              "CANDIDATE_PROVENANCE.json": "f0736ae5e496becbc1e6f72bcf663d631353553f",
              "candidates.py": "0b7cfb79bb7857b86ef7fd59a97b5f55ef2a9565",
              "SYNTHETIC_R1_RESULT.json": "3cfba4da70f7d471a00c880a075f41727b7d4261",
              "inspect_training_metadata.py": "0ba8847ca882d917c7cdbd0bb7066df3b6f3fa74",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          result = json.loads(Path("SYNTHETIC_R1_RESULT.json").read_text())
          if result["passed"] != 280 or result["failed"] != 0:
              raise SystemExit("synthetic gate not sealed green")
          print("LEXIGEN_V4_TASK6_METADATA_R1_PACKAGE_FROZEN")
          PY
      - name: Compile metadata inspector only
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: python -m py_compile inspect_training_metadata.py
      - name: Inspect training structure and lock untouched test identity
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: python -u inspect_training_metadata.py
      - name: Upload immutable metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task6-unit-simplex-projection-metadata-r1
          path: lexigen-v4/tasks/06-unit-simplex-projection/metadata-evidence/
          if-no-files-found: error
          retention-days: 90
