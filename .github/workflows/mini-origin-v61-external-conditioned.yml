name: Mini-ORIGIN External Conditioned Blind v0.61

on:
  push:
    branches:
      - research/mini-origin-v61-external-conditioned-blind
    paths:
      - "mini-origin/external-data/uci-v61/manifest.json"
      - "mini-origin/src/mini_origin/external_conditioned_v61.py"
      - "mini-origin/src/mini_origin/external_conditioned_validate_v61.py"
      - ".github/workflows/mini-origin-v61-external-conditioned.yml"
      - "mini-origin/compiled/response_cost_pareto_v57.rs"
  pull_request:
    paths:
      - "mini-origin/external-data/uci-v61/manifest.json"
      - "mini-origin/src/mini_origin/external_conditioned_v61.py"
      - "mini-origin/src/mini_origin/external_conditioned_validate_v61.py"
      - ".github/workflows/mini-origin-v61-external-conditioned.yml"
      - "mini-origin/compiled/response_cost_pareto_v57.rs"
  workflow_dispatch:

concurrency:
  group: mini-origin-v61-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-conditioned:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen generator and archive lock
        run: >-
          python -c "import json; p=json.load(open('../research-evidence/mini-origin-v60-conditioned-cell-pass.json')); m=json.load(open('external-data/uci-v61/manifest.json')); assert p['development_gate']; assert p['frozen_frontier_digest']=='fe0c56d83095bfc6607f9bfffb480ca829f369d6bd9db5ff47860184f7e246fb'; assert m['lock_digest']=='83990b00da28967c74dced5043c548b5ede0d11bcdbefeb4d7b609e6f872de62'; assert m['dataset_count']==7"
      - name: Parse frozen archives and compute Python reference
        run: >-
          mkdir -p results/v61 &&
          python -m mini_origin.external_conditioned_v61
          --states results/v61/states.txt
          --reference results/v61/python-reference.json
      - name: Compile independent Rust solver
        run: rustc -C opt-level=3 -C debuginfo=0 compiled/response_cost_pareto_v57.rs -o results/v61/response_cost_pareto_v61
      - name: Run independent Rust solver
        run: results/v61/response_cost_pareto_v61 --input results/v61/states.txt --output results/v61/rust-results.json
      - name: Apply unchanged locked blind gate
        run: >-
          python -m mini_origin.external_conditioned_validate_v61
          --reference results/v61/python-reference.json
          --rust results/v61/rust-results.json
          --output results/v61/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v61-external-conditioned
          path: |
            mini-origin/results/v61/python-reference.json
            mini-origin/results/v61/rust-results.json
            mini-origin/results/v61/evidence.json
          retention-days: 90
