name: Mini-ORIGIN OpenML Cross-Source Blind v0.78

on:
  push:
    branches:
      - research/mini-origin-v78-openml-blind
    paths:
      - "research-evidence/mini-origin-v77-openml-hash-lock.json"
      - "mini-origin/campaigns/v78-openml-blind.json"
      - "mini-origin/pyproject.toml"
      - "mini-origin/src/mini_origin/openml_blind_v78.py"
      - "mini-origin/tests/test_openml_blind_v78.py"
      - "mini-origin/scripts/run_v78_ci.sh"
      - ".github/workflows/mini-origin-v78-openml-blind.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v78-openml-blind
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openml-cross-source-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN and frozen ARFF parser
        run: python -m pip install -e ".[dev]"
      - name: Run preregistered OpenML blind campaign
        run: bash scripts/run_v78_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v78-openml-cross-source-blind
          path: |
            mini-origin/results/v78/python-reference.json
            mini-origin/results/v78/rust-results.json
            mini-origin/results/v78/evidence.json
            mini-origin/results/v78/adapted-manifest.json
          if-no-files-found: warn
          retention-days: 90
