name: LEXIGEN v3 World SHA256 R1 Synthetic

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v3-world/task3-sha256-r1/TRIGGER_SYNTHETIC"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v3-world/task3-sha256-r1/requirements.txt
      - name: Verify frozen Python and C candidate sources
        working-directory: lexigen-v3-world/task3-sha256-r1
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "candidates.py": "93ce7f387b7faa9869e2fcf8e4946c256e625ac0",
              "native_sha256.c": "ab643a83c7f4e69d86f11c49a8fe0229040ac1af",
          }
          for name, blob in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != blob:
                  raise SystemExit(f"{name} mismatch: {actual} != {blob}")
          print("LEXIGEN_V3_WORLD_SHA256_R1_FROZEN")
          PY
      - name: Install benchmark-matched cryptography
        working-directory: lexigen-v3-world/task3-sha256-r1
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build frozen native SHA-256 extension
        working-directory: lexigen-v3-world/task3-sha256-r1
        run: |
          gcc -O3 -shared -fPIC \
            $(python3-config --includes) \
            native_sha256.c \
            -o lexigen_sha256_native$(python3-config --extension-suffix) \
            -lcrypto
      - name: Run synthetic exactness and diagnostic timing
        working-directory: lexigen-v3-world/task3-sha256-r1
        run: python -u synthetic_validate.py
      - name: Upload synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v3-world-sha256-r1-synthetic-evidence
          path: lexigen-v3-world/task3-sha256-r1/synthetic-result.json
          if-no-files-found: error
          retention-days: 90
