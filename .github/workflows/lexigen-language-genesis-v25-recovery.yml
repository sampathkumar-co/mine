name: Lexigen Language Genesis v25 Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/lexigen-language-genesis-v25-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-interrupted:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        task:
          - "6cf79266"
          - "0dfd9992"
          - "319f2597"
    steps:
      - name: Check out frozen v25
        uses: actions/checkout@v4
      - name: Check out pinned ARC-GEN
        uses: actions/checkout@v4
        with:
          repository: google/ARC-GEN
          ref: a15cbdb44c776610aeeb9f487a06af875d3d0878
          path: arcgen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute one interrupted identity
        run: |
          python lexigen-language-genesis/v25/scan_one_v25.py \
            --arcgen-root arcgen \
            --task-id "${{ matrix.task }}" \
            --split discovery \
            --output "task-${{ matrix.task }}.json"
      - name: Upload recovery report
        uses: actions/upload-artifact@v4
        with:
          name: v25-recovery-${{ matrix.task }}
          path: task-${{ matrix.task }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate-recovered-denominator:
    needs: recover-interrupted
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download 37 immutable original reports
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: sampathkumar-co/mine
          run-id: 30467389946
          pattern: v25-discovery-*
          path: original-reports
          merge-multiple: true
      - name: Download three recovery reports
        uses: actions/download-artifact@v4
        with:
          pattern: v25-recovery-*
          path: recovery-reports
          merge-multiple: true
      - name: Assemble exact frozen denominator
        run: |
          mkdir combined-reports
          for report in original-reports/task-*.json; do
            case "$(basename "$report")" in
              task-6cf79266.json|task-0dfd9992.json|task-319f2597.json) ;;
              *) cp "$report" combined-reports/ ;;
            esac
          done
          cp recovery-reports/task-*.json combined-reports/
          test "$(find combined-reports -maxdepth 1 -name 'task-*.json' | wc -l)" -eq 40
      - name: Build recovered frozen library
        run: |
          python lexigen-language-genesis/v25/aggregate_discovery_v25.py \
            --reports-root combined-reports \
            --output lexigen-language-genesis/v25/V25_DISCOVERY_REPORT.json \
            --library-output lexigen-language-genesis/v25/V25_LIBRARY.json \
            --library-dir lexigen-language-genesis/v25/library
      - name: Upload complete v25 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v25-recovered-discovery-evidence
          path: |
            lexigen-language-genesis/v25/V25_DISCOVERY_REPORT.json
            lexigen-language-genesis/v25/V25_LIBRARY.json
            lexigen-language-genesis/v25/library
            combined-reports
          if-no-files-found: error
          retention-days: 90
