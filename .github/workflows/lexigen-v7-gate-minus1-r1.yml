name: LEXIGEN V7 Gate Minus1 R2
on:
  pull_request:
    branches: [lexigen/v5-campaign-final-audit-r1]
    paths:
      - "lexigen-v7-gate-minus1/TRIGGER_RUN_R2"

permissions:
  contents: read

jobs:
  gate-minus1-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen R2 package
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-gate-minus1/LOCK_R2.json').read_text())
          paths={
            'PROTOCOL.md':'lexigen-v7-gate-minus1/PROTOCOL.md',
            'EXPERIMENT_SPEC.json':'lexigen-v7-gate-minus1/EXPERIMENT_SPEC.json',
            'gate_minus1.py':'lexigen-v7-gate-minus1/gate_minus1.py',
            'oracle_r2.py':'lexigen-v7-gate-minus1/oracle_r2.py',
            'R1_FIXTURE_INCIDENT.json':'lexigen-v7-gate-minus1/R1_FIXTURE_INCIDENT.json',
            'workflow':'.github/workflows/lexigen-v7-gate-minus1-r1.yml',
          }
          for key,path in paths.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got != lock['git_blob_sha1'][key]:
                  raise SystemExit(f'R2 lock mismatch {key}: {got}')
          if lock['trigger_present_at_lock']:
              raise SystemExit('R2 trigger existed before lock')
          PY
      - name: Compile frozen R2 code
        run: python -m py_compile lexigen-v7-gate-minus1/gate_minus1.py lexigen-v7-gate-minus1/oracle_r2.py
      - name: Generate and verify frozen oracle
        shell: bash
        run: |
          python lexigen-v7-gate-minus1/oracle_r2.py --output /tmp/lexigen-v7-oracle-r2.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-gate-minus1/LOCK_R2.json').read_text())
          got=hashlib.sha256(Path('/tmp/lexigen-v7-oracle-r2.json').read_bytes()).hexdigest()
          if got != lock['oracle_json_file_sha256']:
              raise SystemExit(f'oracle digest mismatch {got}')
          PY
      - name: Execute frozen Gate -1 R2
        run: |
          python lexigen-v7-gate-minus1/gate_minus1.py \
            --spec lexigen-v7-gate-minus1/EXPERIMENT_SPEC.json \
            --oracle /tmp/lexigen-v7-oracle-r2.json \
            --output gate-minus1-r2-evidence
      - name: Preserve oracle with evidence
        if: always()
        shell: bash
        run: |
          mkdir -p gate-minus1-r2-evidence
          cp /tmp/lexigen-v7-oracle-r2.json gate-minus1-r2-evidence/ORACLE_R2.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexigen-v7-gate-minus1-r2
          path: gate-minus1-r2-evidence/
          if-no-files-found: error
          retention-days: 90
