name: LEXIGEN V7 Gate Minus1 R1
on:
  pull_request:
    branches: [lexigen/v5-campaign-final-audit-r1]
    paths:
      - "lexigen-v7-gate-minus1/TRIGGER_RUN_R1"

permissions:
  contents: read

jobs:
  gate-minus1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify preregistered lock
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-gate-minus1/LOCK_R1.json').read_text())
          paths={
            'PROTOCOL.md':'lexigen-v7-gate-minus1/PROTOCOL.md',
            'EXPERIMENT_SPEC.json':'lexigen-v7-gate-minus1/EXPERIMENT_SPEC.json',
            'gate_minus1.py':'lexigen-v7-gate-minus1/gate_minus1.py',
          }
          for key,path in paths.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got != lock['git_blob_sha1'][key]:
                  raise SystemExit(f'lock mismatch {key}: {got}')
          if lock['trigger_present_at_lock']:
              raise SystemExit('trigger was present before preregistration lock')
          PY
      - name: Compile frozen experiment
        run: python -m py_compile lexigen-v7-gate-minus1/gate_minus1.py
      - name: Execute frozen Gate -1
        run: |
          python lexigen-v7-gate-minus1/gate_minus1.py \
            --spec lexigen-v7-gate-minus1/EXPERIMENT_SPEC.json \
            --output gate-minus1-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v7-gate-minus1-r1
          path: gate-minus1-evidence/
          if-no-files-found: error
          retention-days: 90
