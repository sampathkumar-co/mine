name: LEXIGEN v4 Task 1 Communicability Metadata R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/01-communicability/TRIGGER_METADATA_R1"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable engine and selection locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify frozen revision-1 candidate family
        working-directory: lexigen-v4/tasks/01-communicability
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "805b5d6631899f802ba89dd252ab88177ca360ab"
          data = Path("candidates.py").read_bytes()
          actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if actual != expected:
              raise SystemExit(f"candidate blob mismatch: {actual} != {expected}")
          if not Path("SYNTHETIC_RESULT.json").is_file():
              raise SystemExit("sealed synthetic result is missing")
          print("LEXIGEN_V4_TASK1_REVISION1_CANDIDATES_FROZEN")
          PY
      - name: Inspect official training manifest and test object identity only
        working-directory: lexigen-v4/tasks/01-communicability
        run: python -u inspect_training_metadata.py
      - name: Upload immutable metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task1-communicability-metadata-r1
          path: lexigen-v4/tasks/01-communicability/metadata-evidence/
          if-no-files-found: error
          retention-days: 90
