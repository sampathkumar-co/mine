name: Mini-ORIGIN Generic Bellman Quotient v0.89

on:
  push:
    branches:
      - research/mini-origin-v89-generic-bellman-quotient
    paths:
      - 'mini-origin/**'
      - '.github/workflows/mini-origin-v89-generic-bellman-quotient.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mini-origin/**'
      - '.github/workflows/mini-origin-v89-generic-bellman-quotient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mini-ORIGIN
        working-directory: mini-origin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run v0.89 tests
        working-directory: mini-origin
        run: |
          set -euo pipefail
          pytest -q tests/test_generic_bellman_quotient_v89.py
      - name: Run full preregistered transfer certificate
        working-directory: mini-origin
        run: |
          set -euo pipefail
          python -m mini_origin.generic_bellman_quotient_v89 \
            --output results/v89/generic-bellman-quotient-evidence.json \
            2>&1 | tee results-v89.log
      - name: Upload v0.89 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v89-generic-bellman-quotient
          path: |
            mini-origin/results/v89/generic-bellman-quotient-evidence.json
            mini-origin/results-v89.log
          if-no-files-found: warn
