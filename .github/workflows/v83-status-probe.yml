name: V83 Status Probe

on:
  pull_request:
    branches:
      - research/mini-origin-v83-medium-small-query-coverage
    paths:
      - ".github/workflows/v83-status-probe.yml"

permissions:
  actions: read
  contents: read

jobs:
  read-only-status:
    runs-on: ubuntu-latest
    steps:
      - name: Query v0.83 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          workflow = "mini-origin-v83-medium-small-query-coverage.yml"
          branch = "research/mini-origin-v83-medium-small-query-coverage"
          query = urllib.parse.urlencode({"branch": branch, "per_page": 10})
          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "mini-origin-v83-status-probe",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          rows = [
              {
                  key: run.get(key)
                  for key in (
                      "id", "name", "status", "conclusion", "event",
                      "head_sha", "html_url", "created_at", "updated_at",
                  )
              }
              for run in payload.get("workflow_runs", [])
          ]
          print(json.dumps(rows, indent=2, sort_keys=True))
          with open("v83-status.json", "w", encoding="utf-8") as handle:
              json.dump(rows, handle, indent=2, sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v83-status-probe
          path: v83-status.json
          retention-days: 1
