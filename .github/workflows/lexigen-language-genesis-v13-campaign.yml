name: Lexigen v13 Campaign Freeze

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/external/V13_CAMPAIGN.md"
      - "lexigen-language-genesis/external/arcgen_campaign_v13.py"
      - ".github/workflows/lexigen-language-genesis-v13-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out campaign commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate campaign wrapper
        working-directory: lexigen-language-genesis/external
        run: python -m py_compile arcgen_campaign_v13.py arcgen_gate_v13.py

      - name: Verify language implementation is unchanged
        run: |
          git diff --exit-code 18885982a880eb903f15752be04f7fd7ab2e8c2f -- \
            lexigen-language-genesis/v7 \
            lexigen-language-genesis/v8 \
            lexigen-language-genesis/v9 \
            lexigen-language-genesis/v10 \
            lexigen-language-genesis/v11 \
            lexigen-language-genesis/v12 \
            lexigen-language-genesis/v13 \
            lexigen-language-genesis/external/arcgen_gate_v13.py

      - name: Verify forty gates and freshness exclusions
        working-directory: lexigen-language-genesis/external
        run: |
          python - <<'PY'
          import arcgen_campaign_v13 as campaign
          expected = {f"v13-campaign-{i:02d}" for i in range(1, 41)}
          assert campaign.ALLOWED_GATES == expected
          assert len(campaign.EXCLUDED_TASK_IDS) == 36
          assert campaign.excluded_task_ids_sha256() == "6b95b2f105c43a9b1aa760e8a2b1d488a6f1d01588168527ce8f4c4586942b2f"
          PY

      - name: Hash campaign contract
        run: sha256sum lexigen-language-genesis/external/V13_CAMPAIGN.md
