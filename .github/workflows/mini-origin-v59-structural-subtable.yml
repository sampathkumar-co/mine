name: Mini-ORIGIN Structural Subtable Frontier v0.59

on:
  push:
    branches:
      - research/mini-origin-v59-structural-subtable-frontier
    paths:
      - "mini-origin/src/mini_origin/structural_subtable_frontier_v59.py"
      - ".github/workflows/mini-origin-v59-structural-subtable.yml"
      - "mini-origin/external-data/uci-v58/manifest.json"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/structural_subtable_frontier_v59.py"
      - ".github/workflows/mini-origin-v59-structural-subtable.yml"
      - "mini-origin/external-data/uci-v58/manifest.json"
  workflow_dispatch:

concurrency:
  group: mini-origin-v59-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify preserved v0.58 rejection and lock
        run: >-
          python -c "import json; r=json.load(open('../research-evidence/mini-origin-v58-external-response-cost-rejected.json')); m=json.load(open('external-data/uci-v58/manifest.json')); assert not r['development_gate']; assert r['frozen_external_digest']=='e06a5501e68536aa44eeaa50fad9fc2f9673d63ff2bc98695e00385d1759d328'; assert m['lock_digest']=='9a1d386209b437081d33a15e3395ac60afbc3e368ecb7a37a5202b5f9aab5868'"
      - name: Run frozen structural subtable development gate
        run: >-
          mkdir -p results/v59 &&
          python -m mini_origin.structural_subtable_frontier_v59
          --output results/v59/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v59-structural-subtable
          path: mini-origin/results/v59/evidence.json
          retention-days: 90
