name: Mini-ORIGIN Operator v0.7

on:
  push:
    paths:
      - ".github/workflows/mini-origin-operator-v7.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-operator-v7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.7 is complete; use workflow_dispatch to reproduce the operator study."

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_operator_transfer_v7.py

  operator-transfer:
    if: github.event_name == 'workflow_dispatch'
    name: operator-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        seed: [71, 72, 73]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: >-
          mkdir -p results &&
          python -m mini_origin.operator_transfer_v7_hardened
          --seed ${{ matrix.seed }}
          --output results/operator-v7-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-operator-v7-seed-${{ matrix.seed }}
          path: mini-origin/results/operator-v7-seed-${{ matrix.seed }}.json
          retention-days: 90

  aggregate-operator-study:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, operator-transfer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-origin-operator-v7-seed-*
          path: operator-artifacts
          merge-multiple: true
      - name: Aggregate independent operator transfers
        run: |
          python - <<'PY'
          import glob, json, statistics
          from pathlib import Path
          rows = []
          for filename in sorted(glob.glob("operator-artifacts/*.json")):
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              rows.append({
                  "seed": data["seed"],
                  "status": data["status"],
                  "strict_template_score": data["strict_template_score"],
                  "strict_shallow_score": data["strict_shallow_score"],
                  "strict_closed_score": data["strict_closed_score"],
              })
          passing = [row for row in rows if row["status"] == "parameterized_operator_transfer_candidate"]
          template = [row["strict_template_score"] for row in rows]
          shallow = [row["strict_template_score"] - row["strict_shallow_score"] for row in rows]
          closed = [row["strict_template_score"] - row["strict_closed_score"] for row in rows]
          summary = {
              "verdict": "replicated_parameterized_operator_transfer_candidate"
              if len(passing) >= 2 and statistics.median(template) >= 0.78
              and statistics.median(shallow) >= 0.22 and statistics.median(closed) >= 0.30
              else "not_yet",
              "runs": rows,
          }
          Path("operator-v7-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-operator-v7-summary
          path: operator-v7-summary.json
          retention-days: 90
