name: Mini-ORIGIN Global vs Local Quotient v0.47

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/global_vs_local_quotient_v47.py"
      - "mini-origin/tests/test_global_vs_local_quotient_v47.py"
      - ".github/workflows/mini-origin-v47-global-vs-local.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/global_vs_local_quotient_v47.py"
      - "mini-origin/tests/test_global_vs_local_quotient_v47.py"
      - ".github/workflows/mini-origin-v47-global-vs-local.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v47-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify global and local equivalence protocol
        run: pytest -q tests/test_global_vs_local_quotient_v47.py
      - name: Run matched exact comparison
        run: >-
          mkdir -p results &&
          python -m mini_origin.global_vs_local_quotient_v47
          --output results/v47-global-vs-local.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v47-global-vs-local
          path: mini-origin/results/v47-global-vs-local.json
          retention-days: 90
