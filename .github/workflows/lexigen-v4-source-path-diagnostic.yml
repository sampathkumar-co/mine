name: LEXIGEN v4 Source Path Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/TRIGGER_SOURCE_PATH_DIAGNOSTIC"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original immutable engine lock
        working-directory: lexigen-v4
        run: python -u verify_engine_lock.py
      - name: Inspect source tree path metadata only
        working-directory: lexigen-v4
        run: python -u diagnose_source_paths.py
      - name: Upload path-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-source-path-diagnostic
          path: lexigen-v4/source-path-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 90
