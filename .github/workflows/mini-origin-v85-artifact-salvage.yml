name: Mini-ORIGIN v0.85 Artifact Salvage Diagnostic

on:
  push:
    branches:
      - research/mini-origin-v85-artifact-salvage
    paths:
      - "mini-origin/scripts/salvage_v85_reference.py"
      - ".github/workflows/mini-origin-v85-artifact-salvage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  salvage-rust-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Download complete pre-crash v0.85 artifact
        uses: actions/download-artifact@v4
        with:
          name: mini-origin-v85-development
          path: mini-origin/results/v85-salvage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: sampathkumar-co/mine
          run-id: 30566963272
      - name: Restore only post-run metadata and verify provenance
        run: python scripts/salvage_v85_reference.py
      - name: Compile unchanged independent Rust solver
        run: |
          rustc -C opt-level=3 -C debuginfo=0 \
            compiled/response_cost_lower_bound_v66.rs \
            -o results/v85-salvage/response_cost_lower_bound_v85
      - name: Replay all 252 preserved states in Rust
        run: |
          results/v85-salvage/response_cost_lower_bound_v85 \
            --input results/v85-salvage/states.txt \
            --output results/v85-salvage/rust-results.json
      - name: Run unchanged final v0.85 validator
        run: |
          python -m mini_origin.pmlb_development_v85 validate \
            --reference results/v85-salvage/python-reference.json \
            --rust results/v85-salvage/rust-results.json \
            --output results/v85-salvage/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v85-artifact-salvage-diagnostic
          path: |
            mini-origin/results/v85-salvage/states.txt
            mini-origin/results/v85-salvage/python-reference.json
            mini-origin/results/v85-salvage/rust-results.json
            mini-origin/results/v85-salvage/evidence.json
            mini-origin/results/v85-salvage/salvage-provenance.json
          if-no-files-found: warn
          retention-days: 90
