name: LEXIGEN V7 GSO Task2 Candidate Materialize R3
on:
  pull_request:
    branches: [lexigen/v7-gso-tasks2-6-proposals-r1]
    paths: ["lexigen-v7-gso/TRIGGER_TASK2_MATERIALIZE_R3"]
permissions: {contents: read}
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen Task2 materialization R3 lock
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-gso/TASK2_MATERIALIZE_LOCK_R3.json').read_text())
          paths={
            'proposal_lock':'lexigen-v7-gso/TASKS2_6_PROPOSAL_LOCK_R1.json',
            'selection':'lexigen-v7-gso/PREFLIGHT_SELECTION_R1.json',
            'r1_result':'lexigen-v7-gso/TASKS2_6_MATERIALIZE_R1_RESULT.json',
            'r2_result':'lexigen-v7-gso/TASK2_MATERIALIZE_R2_RESULT.json',
            'r1_builder':'lexigen-v7-gso/build_candidate_r1.py',
            'r2_builder':'lexigen-v7-gso/build_task2_candidate_r2.py',
            'r3_builder':'lexigen-v7-gso/build_task2_candidate_r3.py',
            'workflow':'.github/workflows/lexigen-v7-gso-task2-materialize-r3.yml',
          }
          for key,path in paths.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=lock['git_blob_sha1'][key]: raise SystemExit(f'Task2 R3 lock mismatch {key}: {got}')
          if lock['candidate_timing_observed_before_lock']:
              raise SystemExit('Task2 timing boundary crossed')
          PY
      - name: Compile builders
        run: python -m py_compile lexigen-v7-gso/build_candidate_r1.py lexigen-v7-gso/build_task2_candidate_r2.py lexigen-v7-gso/build_task2_candidate_r3.py
      - name: Pull frozen Task2 image and copy target
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="slimshetty/gso:gso.eval.x86_64.abetlen__llama-cpp-python-2bc1d97"
          docker pull "$IMAGE"
          C=$(docker create "$IMAGE" true)
          mkdir -p base/llama_cpp
          docker cp "$C:/testbed/llama_cpp/llama.py" base/llama_cpp/llama.py
          docker rm "$C"
      - name: Materialize unchanged nine Task2 candidates without execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,shutil
          from pathlib import Path
          sel=json.loads(Path('lexigen-v7-gso/PREFLIGHT_SELECTION_R1.json').read_text())['tasks']['2']
          candidates=sel['v7_full']+sel['v7_no_library']+sel['v7_random_library']
          out=Path('materialized'); out.mkdir()
          records=[]
          expected={
            'F1':'1b053c99ea6cce4551f52c141037a42c50fa09761b6c5efb9d051d5a99d8bf7d',
            'F2':'d7a86f9079292b09a00e39a1017034d5fc6111ae3dee4c8eacaa866f5c2b274e',
            'F4':'5e8b000c05be80f44f7a59d96699748c330fa7510ebb42e8757c4abaad97c7c1',
            'N1':'d7a86f9079292b09a00e39a1017034d5fc6111ae3dee4c8eacaa866f5c2b274e',
            'N3':'dae026b5a55515a62b7b6f3fcd53f5d25bd2ef7706b67c144c2787de6bf8583b',
            'N6':'5e8b000c05be80f44f7a59d96699748c330fa7510ebb42e8757c4abaad97c7c1',
            'R1':'5e8b000c05be80f44f7a59d96699748c330fa7510ebb42e8757c4abaad97c7c1',
          }
          for cid in candidates:
              root=Path('work')/cid
              dest=root/'llama_cpp/llama.py'
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile('base/llama_cpp/llama.py',dest)
              c_out=out/cid
              subprocess.run(['python','lexigen-v7-gso/build_task2_candidate_r3.py','--candidate',cid,'--root',str(root),'--output',str(c_out)],check=True)
              rec=json.loads((c_out/f'task2-{cid}.json').read_text())
              if cid in expected and rec['patch_sha256']!=expected[cid]:
                  raise SystemExit(f'{cid} changed across construction-only repair')
              records.append(rec)
          payload={'task':2,'candidate_count':len(records),'candidates':records,'candidate_execution_count':0,'candidate_timing_observed':False,'prior_successful_patch_hashes_preserved':True}
          (out/'MATERIALIZE_RESULT_R3.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v7-gso-task2-02-llama-gen-b-materialized-r3
          path: materialized/
          if-no-files-found: error
          retention-days: 90
