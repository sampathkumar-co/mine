name: Mini-ORIGIN ClaimGuard External v0.18

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/claim_contract_v18.py"
      - "mini-origin/src/mini_origin/claim_guard_adapter_v18.py"
      - "mini-origin/independent/claim_guard_external_v18.mjs"
      - "mini-origin/independent/claim_guard_verifier_v18.mjs"
      - ".github/workflows/mini-origin-claim-guard-external-v18.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/claim_contract_v18.py"
      - "mini-origin/src/mini_origin/claim_guard_adapter_v18.py"
      - "mini-origin/independent/claim_guard_external_v18.mjs"
      - "mini-origin/independent/claim_guard_verifier_v18.mjs"
      - ".github/workflows/mini-origin-claim-guard-external-v18.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-claim-guard-external-v18-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  independent-red-team:
    name: external-red-team-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [301, 302, 303, 304, 305]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Generate independent JavaScript mutation suite and run Python verifier
        run: >-
          mkdir -p results &&
          node independent/claim_guard_external_v18.mjs
          --seed ${{ matrix.seed }}
          --output results/claim-guard-external-v18-seed-${{ matrix.seed }}.json
      - name: Run independent JavaScript verifier on the frozen cases
        run: >-
          node independent/claim_guard_verifier_v18.mjs
          --input results/claim-guard-external-v18-seed-${{ matrix.seed }}.json.cases.json
          --output results/claim-guard-external-v18-seed-${{ matrix.seed }}.json.verifier.json
      - name: Upload independent evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-claim-guard-external-v18-seed-${{ matrix.seed }}
          path: |
            mini-origin/results/claim-guard-external-v18-seed-${{ matrix.seed }}.json
            mini-origin/results/claim-guard-external-v18-seed-${{ matrix.seed }}.json.cases.json
            mini-origin/results/claim-guard-external-v18-seed-${{ matrix.seed }}.json.adapter.json
            mini-origin/results/claim-guard-external-v18-seed-${{ matrix.seed }}.json.verifier.json
          retention-days: 90

  aggregate-independent-study:
    needs: independent-red-team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-origin-claim-guard-external-v18-seed-*
          path: evidence
          merge-multiple: true
      - name: Aggregate cross-language verifier agreement
        run: |
          python - <<'PY'
          import glob
          import json
          from collections import Counter
          from pathlib import Path

          rows = []
          misses = Counter()
          disagreement = Counter()
          for filename in sorted(glob.glob("evidence/claim-guard-external-v18-seed-*.json")):
              if filename.endswith((".cases.json", ".adapter.json", ".verifier.json")):
                  continue
              main = json.loads(Path(filename).read_text(encoding="utf-8"))
              adapter = json.loads(Path(filename + ".adapter.json").read_text(encoding="utf-8"))
              verifier = json.loads(Path(filename + ".verifier.json").read_text(encoding="utf-8"))

              python_decisions = {
                  item["name"]: item["observed_accept"]
                  for item in adapter["results"]
              }
              js_decisions = {
                  item["name"]: item["observed_accept"]
                  for item in verifier["results"]
              }
              names = sorted(set(python_decisions) | set(js_decisions))
              disagreements = [
                  name for name in names
                  if python_decisions.get(name) != js_decisions.get(name)
              ]
              disagreement.update(disagreements)
              misses.update(main["missed_cases"])
              rows.append({
                  "seed": main["seed"],
                  "case_count": main["case_count"],
                  "python_accuracy": main["accuracy"],
                  "python_all_correct": main["all_correct"],
                  "javascript_accuracy": verifier["accuracy"],
                  "javascript_all_correct": verifier["all_correct"],
                  "verifier_agreement": not disagreements,
                  "disagreements": disagreements,
                  "missed_cases": main["missed_cases"],
              })

          summary = {
              "verdict": (
                  "cross_language_verification_passed"
                  if len(rows) == 5
                  and all(row["python_all_correct"] for row in rows)
                  and all(row["javascript_all_correct"] for row in rows)
                  and all(row["verifier_agreement"] for row in rows)
                  else "cross_language_verification_exposed_gaps"
              ),
              "claim_scope": (
                  "independently implemented Python and JavaScript verifiers agree on independently "
                  "generated frozen mutation cases; this is internal cross-language reproduction, "
                  "not reproduction by an outside researcher or institution"
              ),
              "run_count": len(rows),
              "case_count_per_run": min((row["case_count"] for row in rows), default=0),
              "python_accuracy_min": min((row["python_accuracy"] for row in rows), default=None),
              "javascript_accuracy_min": min((row["javascript_accuracy"] for row in rows), default=None),
              "agreement_count": sum(row["verifier_agreement"] for row in rows),
              "missed_case_frequency": dict(sorted(misses.items())),
              "disagreement_frequency": dict(sorted(disagreement.items())),
              "rows": rows,
          }
          Path("claim-guard-external-v18-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps({key: value for key, value in summary.items() if key != "rows"}, indent=2))
          PY
      - name: Upload cross-language aggregate
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-claim-guard-external-v18-summary
          path: claim-guard-external-v18-summary.json
          retention-days: 90
