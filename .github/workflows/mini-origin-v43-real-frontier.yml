name: Mini-ORIGIN Real Exact Frontier v0.43

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/real_exact_frontier_v43.py"
      - "mini-origin/src/mini_origin/real_exact_frontier_runner_v43.py"
      - "mini-origin/tests/test_real_exact_frontier_v43.py"
      - ".github/workflows/mini-origin-v43-real-frontier.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/real_exact_frontier_v43.py"
      - "mini-origin/src/mini_origin/real_exact_frontier_runner_v43.py"
      - "mini-origin/tests/test_real_exact_frontier_v43.py"
      - ".github/workflows/mini-origin-v43-real-frontier.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v43-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify frontier protocol
        run: >-
          mkdir -p results &&
          pytest -vv tests/test_real_exact_frontier_v43.py
          --junitxml=results/v43-tests.xml
      - name: Upload proof-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v43-test-report
          path: mini-origin/results/v43-tests.xml
          retention-days: 30
      - name: Run real exact-search frontier
        run: >-
          python -m mini_origin.real_exact_frontier_runner_v43
          --output results/v43-frontier.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v43-frontier
          path: mini-origin/results/v43-frontier.json
          retention-days: 90
