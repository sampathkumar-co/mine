name: Lexigen Language Genesis v24

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/v24/**"
      - ".github/workflows/lexigen-language-genesis-v24.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v24:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test frozen grammar
        run: |
          python -m py_compile lexigen-language-genesis/v24/*.py
          python lexigen-language-genesis/v24/test_v24.py

  scan-discovery:
    needs: test-v24
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        task:
          - "3bd67248"
          - "b457fec5"
          - "31d5ba1a"
          - "46442a0e"
          - "d47aa2ff"
          - "85fa5666"
          - "b527c5c6"
          - "c59eb873"
          - "5b37cb25"
          - "90347967"
          - "53b68214"
          - "5af49b42"
          - "3cd86f4f"
          - "80af3007"
          - "50aad11f"
          - "6fa7a44f"
          - "3490cc26"
          - "b4a43f3b"
          - "84db8fc4"
          - "445eab21"
          - "ba1aa698"
          - "83302e8f"
          - "22168020"
          - "7d1f7ee8"
          - "6ad5bdfd"
          - "84ba50d3"
          - "ae58858e"
          - "c9f8e694"
          - "00d62c1b"
          - "af726779"
          - "e8dc4411"
          - "5751f35e"
          - "1a6449f1"
          - "342ae2ed"
          - "05269061"
          - "ba26e723"
          - "c62e2108"
          - "03560426"
          - "ed98d772"
          - "25d487eb"
          - "f25ffba3"
          - "b5bb5719"
          - "8a371977"
          - "5289ad53"
          - "0e671a1a"
          - "88a10436"
          - "62b74c02"
          - "2753e76c"
          - "2546ccf6"
          - "833966f4"
          - "1efba499"
          - "bb43febb"
          - "bc4146bd"
          - "aa18de87"
          - "7d7772cc"
          - "bf699163"
          - "bd5af378"
          - "8403a5d5"
          - "692cd3b6"
          - "070dd51e"
          - "1478ab18"
          - "2013d3e2"
          - "e84fef15"
          - "7e2bad24"
    steps:
      - name: Check out v24
        uses: actions/checkout@v4
      - name: Check out pinned ARC-GEN
        uses: actions/checkout@v4
        with:
          repository: google/ARC-GEN
          ref: a15cbdb44c776610aeeb9f487a06af875d3d0878
          path: arcgen
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan one frozen discovery identity
        run: |
          python lexigen-language-genesis/v24/scan_one_v24.py \
            --arcgen-root arcgen \
            --task-id "${{ matrix.task }}" \
            --split discovery \
            --output "task-${{ matrix.task }}.json"
      - name: Upload task report
        uses: actions/upload-artifact@v4
        with:
          name: v24-discovery-${{ matrix.task }}
          path: task-${{ matrix.task }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate-discovery:
    needs: scan-discovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all frozen reports
        uses: actions/download-artifact@v4
        with:
          pattern: v24-discovery-*
          path: reports
          merge-multiple: true
      - name: Freeze factorized discovery library
        run: |
          python lexigen-language-genesis/v24/aggregate_discovery_v24.py \
            --reports-root reports \
            --output lexigen-language-genesis/v24/V24_DISCOVERY_REPORT.json \
            --library-output lexigen-language-genesis/v24/V24_LIBRARY.json \
            --library-dir lexigen-language-genesis/v24/library
      - name: Upload v24 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v24-discovery-evidence
          path: |
            lexigen-language-genesis/v24/V24_DISCOVERY_REPORT.json
            lexigen-language-genesis/v24/V24_LIBRARY.json
            lexigen-language-genesis/v24/library
            reports
          if-no-files-found: error
          retention-days: 90
