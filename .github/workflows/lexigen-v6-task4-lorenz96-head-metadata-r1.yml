name: LEXIGEN v6 Task 4 Lorenz96 HEAD Metadata R1
on:
  push:
    branches: [lexigen/v6-task4-ode-lorenz96-nonchaotic-r1]
    paths: ["lexigen-v6/tasks/04-ode-lorenz96-nonchaotic/TRIGGER_HEAD_METADATA_R1"]
permissions: {contents: read}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen HEAD metadata package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/04-ode-lorenz96-nonchaotic/DATASET_HEAD_METADATA_R1_LOCK.json').read_text())
          for key,path in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip();expected=lock['git_blob_sha1'][key]
              if got!=expected:raise SystemExit(f'head metadata lock mismatch {key}: {got} != {expected}')
          if lock['test_manifest_body_opened_before_lock'] or lock['payloads_opened_before_lock']:
              raise SystemExit('test boundary crossed')
          PY
      - name: Compile frozen HEAD-only reader
        run: python -m py_compile lexigen-v6/tasks/04-ode-lorenz96-nonchaotic/dataset_head_metadata.py
      - name: Read revision-pinned storage headers only
        run: python lexigen-v6/tasks/04-ode-lorenz96-nonchaotic/dataset_head_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task4-lorenz96-head-metadata-r1
          path: dataset-head-metadata.json
          if-no-files-found: error
          retention-days: 90
