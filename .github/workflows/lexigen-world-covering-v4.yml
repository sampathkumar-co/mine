name: LEXIGEN World Covering Record v4
on:
  pull_request:
    branches: [main]
    paths: ["lexigen-world-covering-v4/TRIGGER_ONCE"]
permissions: {contents: read}
jobs:
  discover-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults: {run: {working-directory: lexigen-world-covering-v4}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: lexigen-world-covering-v4/requirements.txt}
      - name: Verify frozen v4 lock
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('LOCK.json').read_text())
          for n,e in d['git_blob_sha1'].items():
            b=Path(n).read_bytes();a=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
            assert a==e,(n,a,e)
          PY
      - run: pip install -r requirements.txt
      - name: Execute one blind v4 search
        run: mkdir -p artifacts && python -u selector_solver.py --output artifacts | tee artifacts/execution.log
      - name: Independently verify
        if: always() && hashFiles('lexigen-world-covering-v4/artifacts/SUMMARY.json') != ''
        run: python verify_results.py --summary artifacts/SUMMARY.json --output artifacts/INDEPENDENT_VERIFICATION.json | tee artifacts/verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: lexigen-world-covering-v4-evidence, path: lexigen-world-covering-v4/artifacts/, retention-days: 90}
