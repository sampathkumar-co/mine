name: LEXIGEN v4 Corrected Engine Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/TRIGGER_VALIDATE_ENGINE_R2"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile corrected frozen engine
        working-directory: lexigen-v4
        run: python -m compileall -q engine.py engine_v2.py selector.py validate_engine_v2.py
      - name: Validate lexical fingerprint, mechanism evidence, baselines and selector
        working-directory: lexigen-v4
        run: python -u validate_engine_v2.py
      - name: Upload corrected snapshot-free validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-engine-validation-r2
          path: lexigen-v4/validation-evidence-r2/
          if-no-files-found: error
          retention-days: 90
