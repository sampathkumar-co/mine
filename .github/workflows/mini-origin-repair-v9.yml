name: Mini-ORIGIN Repair v0.9

on:
  push:
    paths:
      - ".github/workflows/mini-origin-repair-v9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.9 is complete; use workflow_dispatch to reproduce the repair study."

  reproduce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [91, 92, 93]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_state_repair_v9.py
      - run: >-
          mkdir -p results &&
          python -m mini_origin.state_repair_v9
          --seed ${{ matrix.seed }}
          --output results/repair-v9-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-repair-v9-seed-${{ matrix.seed }}
          path: mini-origin/results/repair-v9-seed-${{ matrix.seed }}.json
          retention-days: 90
