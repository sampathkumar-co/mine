name: Mini-ORIGIN OpenML Cross-Source Evaluation v0.78

on:
  push:
    branches:
      - research/mini-origin-v78-openml-cross-source-evaluation
    paths:
      - "mini-origin/campaigns/v78-openml-cross-source-evaluation.json"
      - "mini-origin/src/mini_origin/openml_cross_source_evaluation_v78.py"
      - "mini-origin/tests/test_openml_cross_source_evaluation_v78.py"
      - "mini-origin/scripts/run_v78_ci.sh"
      - ".github/workflows/mini-origin-v78-openml-cross-source-evaluation.yml"
  pull_request:
    paths:
      - "mini-origin/campaigns/v78-openml-cross-source-evaluation.json"
      - "mini-origin/src/mini_origin/openml_cross_source_evaluation_v78.py"
      - "mini-origin/tests/test_openml_cross_source_evaluation_v78.py"
      - "mini-origin/scripts/run_v78_ci.sh"
      - ".github/workflows/mini-origin-v78-openml-cross-source-evaluation.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v78-openml-cross-source-evaluation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openml-cross-source-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Run frozen OpenML cross-source campaign
        run: bash scripts/run_v78_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v78-openml-cross-source-evaluation
          path: |
            mini-origin/results/v78/python-reference.json
            mini-origin/results/v78/rust-results.json
            mini-origin/results/v78/evidence.json
          if-no-files-found: warn
          retention-days: 90
