name: Mini-ORIGIN External Envelope v0.39

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/external_envelope_v39.py"
      - "mini-origin/tests/test_external_envelope_v39.py"
      - "mini-origin/external-data/uci-v39/manifest.json"
      - ".github/workflows/mini-origin-v39-external-envelope.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/external_envelope_v39.py"
      - "mini-origin/tests/test_external_envelope_v39.py"
      - "mini-origin/external-data/uci-v39/manifest.json"
      - ".github/workflows/mini-origin-v39-external-envelope.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v39-external-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify frozen protocol and parsers
        run: pytest -q tests/test_external_envelope_v39.py
      - name: Evaluate five untouched row permutations
        run: >-
          mkdir -p results &&
          python -m mini_origin.external_envelope_v39
          --output results/v39-external.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v39-external
          path: mini-origin/results/v39-external.json
          retention-days: 90
