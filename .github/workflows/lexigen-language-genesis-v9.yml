name: Lexigen Language Genesis v9

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/v9/**"
      - ".github/workflows/lexigen-language-genesis-v9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-motion-growth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen v9 branch
        uses: actions/checkout@v4
        with:
          path: current

      - name: Check out gate-7 redacted evidence only
        uses: actions/checkout@v4
        with:
          ref: lexigen/external-arcgen-gate7
          path: gate7

      - name: Check out pinned ARC-GEN source
        uses: actions/checkout@v4
        with:
          repository: google/ARC-GEN
          ref: a15cbdb44c776610aeeb9f487a06af875d3d0878
          path: arcgen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Run v9 adversarial tests
        working-directory: current/lexigen-language-genesis/v9
        run: python -m pytest -q

      - name: Reproduce v9 mechanism gate
        working-directory: current/lexigen-language-genesis/v9
        run: |
          python replay_gate7_v9.py \
            --redacted ../../../gate7/lexigen-language-genesis/external/evidence/arcgen-gate7/redacted-task.json \
            --arcgen-root ../../../arcgen \
            --output-dir artifacts/v9

      - name: Hash evidence
        working-directory: current/lexigen-language-genesis/v9
        run: sha256sum artifacts/v9/*.json | tee artifacts/v9/SHA256SUMS

      - name: Upload v9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-language-genesis-v9-${{ github.sha }}
          path: current/lexigen-language-genesis/v9/artifacts/v9/
          if-no-files-found: error
          retention-days: 90
