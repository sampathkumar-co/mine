name: LEXIGEN v5 Task 3 Spectral Clustering Source R1

on:
  pull_request:
    branches:
      - lexigen/v5-task2-aes-gcm-encryption-result-r1
    paths:
      - "lexigen-v5/tasks/03-spectral-clustering/TRIGGER_SOURCE_R1"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen campaign scientific files
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('lexigen-v5/ENGINE_LOCK.json').read_text())
          expected = lock['git_blob_sha1']
          paths = {
              'PROTOCOL.md': 'lexigen-v5/PROTOCOL.md',
              'TRANSFER_MEMORY.json': 'lexigen-v5/TRANSFER_MEMORY.json',
              'CONTAMINATION_EXCLUSIONS.json': 'lexigen-v5/CONTAMINATION_EXCLUSIONS.json',
              'engine.py': 'lexigen-v5/engine.py',
              'selector.py': 'lexigen-v5/selector.py',
              'selftest.py': 'lexigen-v5/selftest.py',
          }
          for key, path in paths.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if actual != expected[key]:
                  raise SystemExit(f'frozen file mismatch {key}: {actual} != {expected[key]}')
          selection = subprocess.check_output(['git','hash-object','lexigen-v5/SELECTION_R1_RESULT.json'], text=True).strip()
          if selection != 'b295027d6154feb7d8050d979815dddf854e000c':
              raise SystemExit(f'selection result mismatch: {selection}')
          print('campaign scientific files verified')
          PY
      - name: Verify Task 3 source lock before source access
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('lexigen-v5/tasks/03-spectral-clustering/SOURCE_R1_LOCK.json').read_text())
          paths = {
              'TASK_START.json': 'lexigen-v5/tasks/03-spectral-clustering/TASK_START.json',
              'prepare_source.py': 'lexigen-v5/tasks/03-spectral-clustering/prepare_source.py',
              'workflow': '.github/workflows/lexigen-v5-task3-spectral-clustering-source-r1.yml',
          }
          for key, path in paths.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if actual != lock['git_blob_sha1'][key]:
                  raise SystemExit(f'Task 3 source lock mismatch {key}: {actual}')
          forbidden = [
              'task_source_opened_before_lock','task_description_opened_before_lock',
              'training_manifest_opened_before_lock','training_payloads_opened_before_lock',
              'test_manifest_opened_before_lock','test_payloads_opened_before_lock',
              'reports_opened_before_lock','public_solvers_opened_before_lock'
          ]
          if any(lock.get(key) for key in forbidden):
              raise SystemExit('Task 3 source boundary is contaminated')
          if int(lock.get('proposal_budget_per_arm', -1)) != 6:
              raise SystemExit('Task 3 proposal budget mismatch')
          print('Task 3 source lock verified')
          PY
      - name: Compile frozen source package
        run: python -m py_compile lexigen-v5/engine.py lexigen-v5/tasks/03-spectral-clustering/prepare_source.py
      - name: Execute source-only analysis
        env:
          PYTHONPATH: lexigen-v5
        run: |
          python lexigen-v5/tasks/03-spectral-clustering/prepare_source.py \
            --task-start lexigen-v5/tasks/03-spectral-clustering/TASK_START.json \
            --output source-evidence
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task3-spectral-clustering-source-r1
          path: source-evidence/
          if-no-files-found: error
          retention-days: 90
