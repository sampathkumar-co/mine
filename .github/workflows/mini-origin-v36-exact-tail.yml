name: Mini-ORIGIN Exact Tail v0.36

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/exact_tail_v36.py"
      - "mini-origin/src/mini_origin/exact_tail_runner_v36.py"
      - "mini-origin/tests/test_exact_tail_v36.py"
      - ".github/workflows/mini-origin-v36-exact-tail.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/exact_tail_v36.py"
      - "mini-origin/src/mini_origin/exact_tail_runner_v36.py"
      - "mini-origin/tests/test_exact_tail_v36.py"
      - ".github/workflows/mini-origin-v36-exact-tail.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v36-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Test exact planner
        run: pytest -q tests/test_exact_tail_v36.py
      - name: Run bounded exact-tail selector
        run: >-
          mkdir -p results &&
          python -m mini_origin.exact_tail_runner_v36
          --output results/v36-development.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v36-development
          path: mini-origin/results/v36-development.json
          retention-days: 90
