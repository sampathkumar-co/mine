name: Mini-ORIGIN Clean Lower-Bound Blind v0.68

on:
  push:
    branches:
      - research/mini-origin-v68-clean-lower-bound-lock
    paths:
      - "mini-origin/external-data/uci-v68/manifest.json"
      - "mini-origin/src/mini_origin/clean_lower_bound_conditioned_v68.py"
      - "mini-origin/src/mini_origin/clean_lower_bound_validate_v68.py"
      - "mini-origin/src/mini_origin/clean_lower_bound_repaired_v68.py"
      - ".github/workflows/mini-origin-v68-clean-lower-bound-conditioned.yml"
      - "mini-origin/compiled/response_cost_lower_bound_v66.rs"
  pull_request:
    paths:
      - "mini-origin/external-data/uci-v68/manifest.json"
      - "mini-origin/src/mini_origin/clean_lower_bound_conditioned_v68.py"
      - "mini-origin/src/mini_origin/clean_lower_bound_validate_v68.py"
      - "mini-origin/src/mini_origin/clean_lower_bound_repaired_v68.py"
      - ".github/workflows/mini-origin-v68-clean-lower-bound-conditioned.yml"
      - "mini-origin/compiled/response_cost_lower_bound_v66.rs"
  workflow_dispatch:

concurrency:
  group: mini-origin-v68-clean-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-lower-bound-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify frozen provenance and solver files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("external-data/uci-v68/manifest.json").read_text())
          registry = json.loads(Path("../research-evidence/mini-origin-v67-updated-dataset-registry.json").read_text())
          rust_evidence = json.loads(Path("../research-evidence/mini-origin-v66-rust-lower-bound-pass.json").read_text())
          expected_ids = [
              3, 8, 12, 14, 19, 22, 26, 33, 44, 46, 50, 59, 62, 63, 67, 69,
              70, 72, 73, 76, 80, 81, 83, 90, 95, 96, 100, 101, 105, 107, 111,
              146, 149, 171, 373, 468, 475, 519, 544, 545, 571, 602, 697, 759,
              850, 863, 864, 891,
          ]
          checks = {
              "archive_lock_digest": manifest["lock_digest"] == "c599849c7ba26fdb3e241221dcae3d3feb26d47ad217da53f0d06b97ebc1e02b",
              "manifest_exclusion_list": manifest["excluded_uci_ids"] == expected_ids,
              "registry_exclusion_list": registry["excluded_uci_ids"] == expected_ids,
              "registry_digest": manifest["repository_registry_digest"] == registry["registry_digest"] == "b88fcb352c2f80af8bc89a3a7576b9cd384800b67d1b168534ad26df9985b6c1",
              "parent_rust_evidence": manifest["parent_v66_evidence_digest"] == rust_evidence["evidence_digest"] == "3b2bb026556ff9f6321ad6a8375854ae46931e64080329c76f86f31d12c0d643",
              "dataset_count": manifest["dataset_count"] == 7,
              "candidate_overlap_empty": not manifest["candidate_overlap"],
          }
          print(json.dumps(checks, indent=2, sort_keys=True))
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit(f"frozen provenance check failed: {failed}")
          PY
          git diff --exit-code f73ad897377ae1189844ea9ab49aa429c6b1c1c3 -- \
            src/mini_origin/conditioned_cell_frontier_v60.py \
            src/mini_origin/response_cost_pareto_v56.py
          git diff --exit-code eecc699ebc66e298b814c3e56ca5e2aee9366da9 -- \
            src/mini_origin/response_cost_lower_bound_v65.py
          git diff --exit-code 2d001d3d4dcec4c315327f318a4918acc552aa7c -- \
            compiled/response_cost_lower_bound_v66.rs
      - name: Verify all seven hash-locked adapters
        run: >-
          python -c "import json; from mini_origin import clean_lower_bound_conditioned_v68 as e; m=json.load(open('external-data/uci-v68/manifest.json')); rows=[]; [(lambda raw,d: rows.append((d['name'],len(e.parse_records(d['name'],raw)),len(e.parse_records(d['name'],raw)[0][0]))))(e.download(d['url']),d) for d in m['datasets']]; print(json.dumps(rows,indent=2))"
      - name: Compute matched Python exact reference
        run: >-
          mkdir -p results/v68 &&
          python -m mini_origin.clean_lower_bound_repaired_v68 reference
          --states results/v68/states.txt
          --reference results/v68/python-reference.json
      - name: Compile independent Rust lower-bound solver
        run: rustc -C opt-level=3 -C debuginfo=0 compiled/response_cost_lower_bound_v66.rs -o results/v68/response_cost_lower_bound_v68
      - name: Run independent Rust lower-bound solver
        run: results/v68/response_cost_lower_bound_v68 --input results/v68/states.txt --output results/v68/rust-results.json
      - name: Apply locked clean external gate
        run: >-
          python -m mini_origin.clean_lower_bound_repaired_v68 validate
          --reference results/v68/python-reference.json
          --rust results/v68/rust-results.json
          --output results/v68/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v68-clean-lower-bound-blind
          path: |
            mini-origin/results/v68/python-reference.json
            mini-origin/results/v68/rust-results.json
            mini-origin/results/v68/evidence.json
          if-no-files-found: warn
          retention-days: 90
