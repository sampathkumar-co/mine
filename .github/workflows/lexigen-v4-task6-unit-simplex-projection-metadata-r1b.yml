name: LEXIGEN v4 Task 6 Unit Simplex Projection Metadata R1B

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/06-unit-simplex-projection/TRIGGER_METADATA_R1B"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable campaign locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify corrected Task 6 metadata package
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
              "TASK_START.json": "6b5942713d7b1e113cc5cf525d109fed519a6895",
              "SOURCE_ANALYSIS_RESULT.json": "5ca25894b2af6097f5b14813e961a8cacb44f135",
              "CANDIDATE_PROVENANCE.json": "f0736ae5e496becbc1e6f72bcf663d631353553f",
              "candidates.py": "0b7cfb79bb7857b86ef7fd59a97b5f55ef2a9565",
              "SYNTHETIC_R1_RESULT.json": "3cfba4da70f7d471a00c880a075f41727b7d4261",
              "inspect_training_metadata.py": "8c70dd27e0c0c9a3f70734c31ea7d419cb4c58d2",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          failure = json.loads(Path("METADATA_R1_PARSER_FAILURE.json").read_text())
          if failure["workflow_run_id"] != 32649263787 or failure["candidate_execution_count"] != 0 or failure["test_payloads_opened"] != 0:
              raise SystemExit("metadata r1 failure record mismatch")
          print("LEXIGEN_V4_TASK6_METADATA_R1B_PACKAGE_FROZEN")
          PY
      - name: Compile header-only metadata inspector
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: python -m py_compile inspect_training_metadata.py
      - name: Inspect training NumPy headers and lock untouched test identity
        working-directory: lexigen-v4/tasks/06-unit-simplex-projection
        run: python -u inspect_training_metadata.py
      - name: Upload immutable corrected metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task6-unit-simplex-projection-metadata-r1b
          path: lexigen-v4/tasks/06-unit-simplex-projection/metadata-evidence/
          if-no-files-found: error
          retention-days: 90
