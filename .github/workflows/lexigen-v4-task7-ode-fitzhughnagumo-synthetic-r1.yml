name: LEXIGEN v4 Task 7 ODE FitzHugh-Nagumo Synthetic R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/07-ode-fitzhughnagumo/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/07-ode-fitzhughnagumo/requirements.txt
      - name: Verify immutable campaign locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify Task 7 synthetic lock before execution
        working-directory: lexigen-v4/tasks/07-ode-fitzhughnagumo
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock = json.loads(Path("SYNTHETIC_R1_LOCK.json").read_text())
          for key, wanted in lock["git_blob_sha1"].items():
              data = Path(key).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{key} blob mismatch: {actual} != {wanted}")
          if lock["candidate_count"] != 27 or lock["synthetic_cases"] != 6 or lock["expected_checks"] != 162:
              raise SystemExit("synthetic budget mismatch")
          if lock["official_training_manifest_opened_before_lock"] or lock["official_training_payloads_opened_before_lock"]:
              raise SystemExit("training boundary violated")
          if lock["official_test_manifest_opened_before_lock"] or lock["official_test_payloads_opened_before_lock"]:
              raise SystemExit("test boundary violated")
          print("LEXIGEN_V4_TASK7_SYNTHETIC_R1_LOCK_VERIFIED")
          PY
      - name: Install frozen dependencies
        working-directory: lexigen-v4/tasks/07-ode-fitzhughnagumo
        run: pip install -r requirements.txt
      - name: Run independent synthetic correctness gate
        working-directory: lexigen-v4/tasks/07-ode-fitzhughnagumo
        run: python -u synthetic_validate.py --output synthetic-evidence
      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task7-ode-fitzhughnagumo-synthetic-r1
          path: lexigen-v4/tasks/07-ode-fitzhughnagumo/synthetic-evidence/
          if-no-files-found: error
          retention-days: 90
