name: LEXIGEN v5 Causal Transfer Holdout Selection R1

on:
  pull_request:
    branches:
      - lexigen/v4-campaign-final-audit-r1
    paths:
      - "lexigen-v5/TRIGGER_SELECT_HOLDOUTS_R1"

permissions:
  contents: read

jobs:
  certify-and-select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen v5 preselection lock
        working-directory: lexigen-v5
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock = json.loads(Path("ENGINE_LOCK.json").read_text())
          for key, wanted in lock["git_blob_sha1"].items():
              path = Path(key)
              if key == "workflow":
                  path = Path("../.github/workflows/lexigen-v5-select-holdouts-r1.yml")
              data = path.read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{key} blob mismatch: {actual} != {wanted}")
          if lock["holdout_task_contents_opened_before_lock"] or lock["holdout_manifests_opened_before_lock"] or lock["holdout_payloads_opened_before_lock"]:
              raise SystemExit("v5 holdout boundary violated before engine lock")
          if lock["task_count"] != 10 or lock["minimum_distinct_families"] != 8 or lock["maximum_per_family"] != 2:
              raise SystemExit("v5 selection gate mismatch")
          print("LEXIGEN_V5_PRESELECTION_LOCK_VERIFIED")
          PY
      - name: Compile frozen v5 engine and selector
        working-directory: lexigen-v5
        run: python -m compileall -q engine.py selftest.py selector.py
      - name: Verify causal transfer separation before inventory selection
        working-directory: lexigen-v5
        run: python -u selftest.py
      - name: Select fresh holdouts using name/path metadata only
        working-directory: lexigen-v5
        run: python -u selector.py
      - name: Upload immutable v5 selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-holdout-selection-r1
          path: lexigen-v5/selection-evidence/
          if-no-files-found: error
          retention-days: 90
