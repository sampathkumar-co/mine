name: LEXIGEN v6 Task 7 SVD Synthetic R1
on:
  push:
    branches: [lexigen/v6-task7-svd-r1]
    paths: ["lexigen-v6/tasks/07-svd/TRIGGER_SYNTHETIC_R1"]
permissions: {contents: read}
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen synthetic package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/07-svd/SYNTHETIC_R1_LOCK.json').read_text())
          for key,path in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip();exp=lock['git_blob_sha1'][key]
              if got!=exp:raise SystemExit(f'lock mismatch {key}: {got} != {exp}')
          if lock['official_train_manifest_opened_before_lock'] or lock['official_test_manifest_opened_before_lock'] or lock['official_payloads_opened_before_lock']:
              raise SystemExit('official-data boundary crossed')
          PY
      - name: Install exact frozen runtime
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.2' 'scipy==1.17.0'
      - name: Fetch exact frozen task source only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          url='https://raw.githubusercontent.com/oripress/AlgoTune/dff9914c10800c7a031c9e8c3d4d1c8cd1b38906/AlgoTuneTasks/svd/svd.py'
          raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'LEXIGEN-v6-task7-synthetic-r1'}),timeout=120).read()
          got=hashlib.sha256(raw).hexdigest();exp='8f7771e5618509c0b8af73390440dd7258a253983cdf8cc03b0208fa4218b018'
          if got!=exp:raise SystemExit(f'source sha mismatch {got} != {exp}')
          open('task-source.py','wb').write(raw)
          PY
      - name: Compile frozen candidate package
        run: python -m py_compile lexigen-v6/tasks/07-svd/candidates.py lexigen-v6/tasks/07-svd/synthetic.py lexigen-v5/engine.py
      - name: Execute independent synthetic correctness screen
        env:
          PYTHONPATH: ${{ github.workspace }}/lexigen-v5:${{ github.workspace }}/lexigen-v6/tasks/07-svd
        run: python lexigen-v6/tasks/07-svd/synthetic.py task-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task7-svd-synthetic-r1
          path: |
            synthetic-summary.json
            synthetic-candidate-plan.json
            synthetic-results.jsonl
          if-no-files-found: error
          retention-days: 90
