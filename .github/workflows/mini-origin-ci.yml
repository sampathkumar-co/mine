name: Mini-ORIGIN CI

on:
  push:
    paths:
      - "mini-origin/**"
      - ".github/workflows/mini-origin-ci.yml"
  pull_request:
    paths:
      - "mini-origin/**"
      - ".github/workflows/mini-origin-ci.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run compact deterministic smoke experiment
        run: mini-origin demo --generations 4 --population 10 --seed 7 --output results/demo.json
      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-demo
          path: mini-origin/results/demo.json

  within-lifetime-learning:
    name: plasticity-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [51, 52, 53, 54, 55]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Evolve feedback plasticity on correlated examples
        run: >-
          mkdir -p results &&
          python -m mini_origin.plasticity_v5
          --seed ${{ matrix.seed }}
          --population 52
          --generations 30
          --output results/plasticity-v5-seed-${{ matrix.seed }}.json
      - name: Upload within-lifetime learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-plasticity-v5-seed-${{ matrix.seed }}
          path: mini-origin/results/plasticity-v5-seed-${{ matrix.seed }}.json
          retention-days: 90

  aggregate-plasticity-study:
    needs: within-lifetime-learning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-origin-plasticity-v5-seed-*
          path: plasticity-artifacts
          merge-multiple: true
      - name: Aggregate independent plasticity searches
        run: |
          python - <<'PY'
          import glob
          import json
          import re
          import statistics
          from pathlib import Path

          rows = []
          for filename in sorted(glob.glob("plasticity-artifacts/*.json")):
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              match = re.search(r"seed-(\d+)", filename)
              seed = int(match.group(1)) if match else -1
              rows.append({
                  "seed": seed,
                  "status": data["status"],
                  "validation_score": data["validation_score"],
                  "strict_hidden_score": data["strict_hidden_score"],
                  "hidden_retention": data["hidden_retention"],
                  "no_learning_score": data["no_learning_score"],
                  "feedback_ablation_score": data["feedback_ablation_score"],
                  "hand_hebb_score": data["hand_hebb_score"],
                  "hand_delta_score": data["hand_delta_score"],
                  "hidden_scores": data["hidden_scores"],
              })

          hidden = [row["strict_hidden_score"] for row in rows]
          retention = [row["hidden_retention"] for row in rows]
          successful = [
              row for row in rows
              if row["status"] == "within_lifetime_learning_breakthrough"
          ]
          ratios = [
              row["strict_hidden_score"] / max(row["hand_delta_score"], 1e-12)
              for row in rows
          ]
          margins = [
              row["strict_hidden_score"]
              - max(row["feedback_ablation_score"], row["hand_hebb_score"])
              for row in rows
          ]
          summary = {
              "verdict": (
                  "replicated_within_lifetime_learning_breakthrough"
                  if len(successful) >= 3
                  and statistics.median(hidden) >= 0.76
                  and statistics.median(retention) >= 0.90
                  and statistics.median(margins) >= 0.16
                  else "not_yet"
              ),
              "claim_scope": (
                  "one inherited dimension-agnostic feedback-plasticity law learns hidden mappings "
                  "from ill-conditioned examples, generalises to isotropic queries and larger dimensions, "
                  "and retains the mapping after cell death; the operator basis remains human-designed"
              ),
              "run_count": len(rows),
              "success_count": len(successful),
              "success_rate": len(successful) / len(rows) if rows else 0.0,
              "successful_seeds": [row["seed"] for row in successful],
              "hidden_min": min(hidden) if hidden else None,
              "hidden_median": statistics.median(hidden) if hidden else None,
              "hidden_mean": statistics.mean(hidden) if hidden else None,
              "hidden_max": max(hidden) if hidden else None,
              "retention_min": min(retention) if retention else None,
              "retention_median": statistics.median(retention) if retention else None,
              "median_feedback_advantage": statistics.median(margins) if margins else None,
              "median_fraction_of_hand_delta": statistics.median(ratios) if ratios else None,
              "runs": rows,
          }
          Path("plasticity-v5-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps({key: value for key, value in summary.items() if key != "runs"}, indent=2))
          PY
      - name: Upload aggregate plasticity evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-plasticity-v5-summary
          path: plasticity-v5-summary.json
          retention-days: 90
