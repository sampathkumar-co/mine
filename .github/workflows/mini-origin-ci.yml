name: Mini-ORIGIN CI

on:
  push:
    paths:
      - "mini-origin/**"
      - ".github/workflows/mini-origin-ci.yml"
  pull_request:
    paths:
      - "mini-origin/**"
      - ".github/workflows/mini-origin-ci.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run compact deterministic smoke experiment
        run: mini-origin demo --generations 5 --population 12 --seed 7 --output results/demo.json
      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-demo
          path: mini-origin/results/demo.json

  verified-base-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reproduce the verified clean relay candidate
        run: >-
          mkdir -p results &&
          python -m mini_origin.research_v2
          --seed 7
          --population 72
          --scale 0.6
          --output results/relay-v2-seed-7.json
      - name: Upload verified base relay
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-relay-v2-seed-7
          path: mini-origin/results/relay-v2-seed-7.json
          retention-days: 90

  robust-resilience-research:
    name: robust-resilience-seed-${{ matrix.seed }}
    needs: verified-base-relay
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [31, 32, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Download verified relay candidate
        uses: actions/download-artifact@v4
        with:
          name: mini-origin-relay-v2-seed-7
          path: base-relay
      - name: Install
        run: python -m pip install -e "mini-origin[dev]"
      - name: Run worst-case domain-randomized resilience search
        run: >-
          mkdir -p mini-origin/results &&
          python -m mini_origin.resilience_v3
          --base base-relay/relay-v2-seed-7.json
          --seed ${{ matrix.seed }}
          --population 56
          --scale 0.70
          --output mini-origin/results/resilience-v3-seed-${{ matrix.seed }}.json
      - name: Upload robust resilience evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-resilience-v3-seed-${{ matrix.seed }}
          path: mini-origin/results/resilience-v3-seed-${{ matrix.seed }}.json
          retention-days: 90

  aggregate-robust-resilience:
    needs: robust-resilience-research
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-origin-resilience-v3-seed-*
          path: robust-artifacts
          merge-multiple: true
      - name: Aggregate independent robust searches
        run: |
          python - <<'PY'
          import glob
          import json
          import re
          import statistics
          from pathlib import Path

          rows = []
          for filename in sorted(glob.glob("robust-artifacts/*.json")):
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              match = re.search(r"seed-(\d+)", filename)
              seed = int(match.group(1)) if match else -1
              rows.append({
                  "seed": seed,
                  "status": data["status"],
                  "validation_score": data["validation_score"],
                  "strict_hidden_score": data["strict_hidden_score"],
                  "base_strict_hidden_score": data["base_strict_hidden_score"],
                  "hidden_scores": data["hidden_scores"],
              })

          hidden = [row["strict_hidden_score"] for row in rows]
          successful = [row for row in rows if row["status"] == "internal_milestone"]
          summary = {
              "verdict": (
                  "replicated_internal_resilience_milestone"
                  if len(successful) >= 2 and statistics.median(hidden) >= 0.60
                  else "not_yet"
              ),
              "claim_scope": (
                  "worst-case local routing across unseen persistent damage distributions; "
                  "not a world-level unconventional-computing breakthrough"
              ),
              "run_count": len(rows),
              "success_count": len(successful),
              "successful_seeds": [row["seed"] for row in successful],
              "hidden_min": min(hidden) if hidden else None,
              "hidden_median": statistics.median(hidden) if hidden else None,
              "hidden_mean": statistics.mean(hidden) if hidden else None,
              "hidden_max": max(hidden) if hidden else None,
              "runs": rows,
          }
          Path("resilience-v3-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps({key: value for key, value in summary.items() if key != "runs"}, indent=2))
          PY
      - name: Upload aggregate robust evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-resilience-v3-summary
          path: resilience-v3-summary.json
          retention-days: 90
