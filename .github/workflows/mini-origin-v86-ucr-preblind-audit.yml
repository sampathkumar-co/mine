name: Mini-ORIGIN UCR Preblind Audit v0.86

on:
  push:
    branches:
      - research/mini-origin-v86-ucr-preblind-audit
    paths:
      - "mini-origin/campaigns/v86-ucr-preblind-audit.json"
      - "mini-origin/campaigns/v86-ucr-preblind-protocol-amendment.json"
      - "mini-origin/src/mini_origin/ucr_preblind_audit_v86.py"
      - "mini-origin/tests/test_ucr_preblind_audit_v86.py"
      - "mini-origin/scripts/run_v86_ci.sh"
      - ".github/workflows/mini-origin-v86-ucr-preblind-audit.yml"
  pull_request:
    paths:
      - "mini-origin/campaigns/v86-ucr-preblind-audit.json"
      - "mini-origin/campaigns/v86-ucr-preblind-protocol-amendment.json"
      - "mini-origin/src/mini_origin/ucr_preblind_audit_v86.py"
      - "mini-origin/tests/test_ucr_preblind_audit_v86.py"
      - "mini-origin/scripts/run_v86_ci.sh"
      - ".github/workflows/mini-origin-v86-ucr-preblind-audit.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v86-ucr-preblind-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Run repository-only UCR preblind audit
        run: bash scripts/run_v86_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v86-ucr-preblind-registry
          path: mini-origin/results/v86/registry.json
          if-no-files-found: warn
          retention-days: 90
