name: LEXIGEN v6 Task 6 Edge Expansion Source Screen R1
on:
  push:
    branches: [lexigen/v6-task6-edge-expansion-r1]
    paths: ["lexigen-v6/tasks/06-edge-expansion/TRIGGER_SOURCE_SCREEN_R1"]
permissions: {contents: read}
jobs:
  source-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen source-screen package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/06-edge-expansion/SOURCE_SCREEN_R1_LOCK.json').read_text())
          for key,path in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              exp=lock['git_blob_sha1'][key]
              if got!=exp: raise SystemExit(f'source-screen lock mismatch {key}: {got} != {exp}')
          if lock['official_train_manifest_opened_before_lock'] or lock['official_test_manifest_opened_before_lock'] or lock['official_payloads_opened_before_lock']:
              raise SystemExit('official-data boundary crossed')
          PY
      - name: Fetch exact frozen task source only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,urllib.request
          url='https://raw.githubusercontent.com/oripress/AlgoTune/dff9914c10800c7a031c9e8c3d4d1c8cd1b38906/AlgoTuneTasks/edge_expansion/edge_expansion.py'
          req=urllib.request.Request(url,headers={'User-Agent':'LEXIGEN-v6-task6-source-screen-r1'})
          raw=urllib.request.urlopen(req,timeout=120).read()
          got=hashlib.sha256(raw).hexdigest(); exp='24d194fbf8f604d318b9f330e61ad084ff4ea498de2c0a299835ad7ecce55d9a'
          if got!=exp: raise SystemExit(f'source sha mismatch {got} != {exp}')
          open('task-source.py','wb').write(raw)
          print('source sha256',got)
          PY
      - name: Compile frozen source screen
        run: python -m py_compile lexigen-v6/tasks/06-edge-expansion/source_screen.py lexigen-v5/engine.py
      - name: Execute frozen source-only screen
        env:
          PYTHONPATH: ${{ github.workspace }}/lexigen-v5
        run: python lexigen-v6/tasks/06-edge-expansion/source_screen.py task-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task6-edge-expansion-source-screen-r1
          path: source-screen.json
          if-no-files-found: error
          retention-days: 90
