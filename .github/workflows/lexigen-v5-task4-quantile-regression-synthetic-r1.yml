name: LEXIGEN v5 Task 4 Quantile Regression Synthetic R1

on:
  pull_request:
    branches:
      - lexigen/v5-task3-spectral-clustering-result-r1
    paths:
      - "lexigen-v5/tasks/04-quantile-regression/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen campaign scientific files
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/ENGINE_LOCK.json').read_text())
          for key,path in {
            'PROTOCOL.md':'lexigen-v5/PROTOCOL.md',
            'TRANSFER_MEMORY.json':'lexigen-v5/TRANSFER_MEMORY.json',
            'CONTAMINATION_EXCLUSIONS.json':'lexigen-v5/CONTAMINATION_EXCLUSIONS.json',
            'engine.py':'lexigen-v5/engine.py',
            'selector.py':'lexigen-v5/selector.py',
            'selftest.py':'lexigen-v5/selftest.py'
          }.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            if actual!=lock['git_blob_sha1'][key]: raise SystemExit(f'frozen campaign mismatch {key}')
          PY
      - name: Verify Task 4 synthetic lock before execution
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/tasks/04-quantile-regression/SYNTHETIC_R1_LOCK.json').read_text())
          for key,path in {
            'SOURCE_R1_RESULT.json':'lexigen-v5/tasks/04-quantile-regression/SOURCE_R1_RESULT.json',
            'candidates.py':'lexigen-v5/tasks/04-quantile-regression/candidates.py',
            'DEPENDENCY_PIN.json':'lexigen-v5/tasks/04-quantile-regression/DEPENDENCY_PIN.json',
            'validate_synthetic.py':'lexigen-v5/tasks/04-quantile-regression/validate_synthetic.py',
            'workflow':'.github/workflows/lexigen-v5-task4-quantile-regression-synthetic-r1.yml'
          }.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            if actual!=lock['git_blob_sha1'][key]: raise SystemExit(f'Task 4 synthetic lock mismatch {key}: {actual}')
          if lock['candidate_count'] != 30 or lock['case_count'] != 6 or lock['expected_checks'] != 180:
            raise SystemExit('Task 4 synthetic shape mismatch')
          for key in ('official_training_manifest_opened_before_lock','official_training_payloads_opened_before_lock','official_test_manifest_opened_before_lock','official_test_payloads_opened_before_lock'):
            if lock.get(key): raise SystemExit(f'boundary flag true: {key}')
          PY
      - name: Compile frozen Task 4 candidate package
        run: python -m py_compile lexigen-v5/tasks/04-quantile-regression/candidates.py lexigen-v5/tasks/04-quantile-regression/validate_synthetic.py
      - name: Install frozen benchmark dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Execute frozen synthetic gate
        working-directory: lexigen-v5/tasks/04-quantile-regression
        run: python validate_synthetic.py --output synthetic-evidence/synthetic-result.json
      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task4-quantile-regression-synthetic-r1
          path: lexigen-v5/tasks/04-quantile-regression/synthetic-evidence/synthetic-result.json
          if-no-files-found: error
          retention-days: 90
