name: Mini-ORIGIN Exhaustive Tree Certificate v0.62

on:
  push:
    branches:
      - research/mini-origin-v62-exhaustive-tree-certificate
    paths:
      - "mini-origin/src/mini_origin/exhaustive_tree_certificate_v62.py"
      - "mini-origin/src/mini_origin/exhaustive_tree_certificate_gate_v62.py"
      - "mini-origin/tests/test_exhaustive_tree_certificate_v62.py"
      - ".github/workflows/mini-origin-v62-exhaustive-tree-certificate.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/exhaustive_tree_certificate_v62.py"
      - "mini-origin/src/mini_origin/exhaustive_tree_certificate_gate_v62.py"
      - "mini-origin/tests/test_exhaustive_tree_certificate_v62.py"
      - ".github/workflows/mini-origin-v62-exhaustive-tree-certificate.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v62-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exhaustive-tree-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        run: python -m pip install -e ".[dev]"
      - name: Verify preserved v0.61 certificate
        run: >-
          python -c "import json; row=json.load(open('../research-evidence/mini-origin-v61-external-conditioned-pass.json')); assert row['development_gate']; assert row['frozen_external_digest']=='413c942b96aa57e5556296f3b1cd70d1832e1bc49cb21128868b24fd48acf32d'; assert row['rust_mismatch_count']==0"
      - name: Run focused tests
        run: pytest -q tests/test_exhaustive_tree_certificate_v62.py
      - name: Run frozen exhaustive complete-tree gate
        run: >-
          mkdir -p results/v62 &&
          python -m mini_origin.exhaustive_tree_certificate_gate_v62
          --output results/v62/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v62-exhaustive-tree-certificate
          path: mini-origin/results/v62/evidence.json
          retention-days: 90
