name: LEXIGEN World Covering Record v2

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-world-covering-v2/TRIGGER_ONCE"

permissions:
  contents: read

jobs:
  discover-covering-records-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: lexigen-world-covering-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-world-covering-v2/requirements.txt

      - name: Verify frozen preregistration lock
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = json.loads(Path("LOCK.json").read_text(encoding="utf-8"))
          for name, expected in lock["git_blob_sha1"].items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"frozen Git-blob mismatch for {name}: {actual} != {expected}")
          if lock["snapshot_md5"] != "b2c626b07f216aac830d344eff5ad523":
              raise SystemExit("snapshot commitment changed")
          if lock["target_count"] != 3 or lock["v1_reserved_count"] != 3:
              raise SystemExit("target counts changed")
          if lock["reservation_rule"] != "exact_frozen_v1_selector_then_exclude_names":
              raise SystemExit("v1 reservation rule changed")
          print("LEXIGEN_WORLD_COVERING_V2_LOCK_VERIFIED")
          PY

      - name: Install frozen solver
        run: python -m pip install -r requirements.txt

      - name: Select untouched v2 targets and execute generic engine
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          python -u selector_solver.py --output artifacts 2>&1 | tee artifacts/execution.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/solver-exit-code.txt
          exit "$code"

      - name: Normalize deterministic evidence attribution
        if: always() && hashFiles('lexigen-world-covering-v2/artifacts/SUMMARY.json') != ''
        run: python -u normalize_evidence.py --summary artifacts/SUMMARY.json

      - name: Independently verify serialized candidates
        if: always() && hashFiles('lexigen-world-covering-v2/artifacts/SUMMARY.json') != ''
        shell: bash
        run: |
          set +e
          python -u verify_results.py \
            --summary artifacts/SUMMARY.json \
            --output artifacts/INDEPENDENT_VERIFICATION.json \
            2>&1 | tee artifacts/verification.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/verifier-exit-code.txt
          exit "$code"

      - name: Upload immutable v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-world-covering-v2-evidence
          path: lexigen-world-covering-v2/artifacts/
          if-no-files-found: error
          retention-days: 90
