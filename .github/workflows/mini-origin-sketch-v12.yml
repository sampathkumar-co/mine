name: Mini-ORIGIN Sketch v0.12

on:
  push:
    paths:
      - ".github/workflows/mini-origin-sketch-v12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.12 is complete; use workflow_dispatch to reproduce the rotating-sketch study."

  reproduce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [121, 122, 123]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_rotating_sketch_v12.py
      - run: >-
          mkdir -p results &&
          python -m mini_origin.rotating_sketch_v12
          --seed ${{ matrix.seed }}
          --output results/sketch-v12-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-sketch-v12-seed-${{ matrix.seed }}
          path: mini-origin/results/sketch-v12-seed-${{ matrix.seed }}.json
          retention-days: 90
