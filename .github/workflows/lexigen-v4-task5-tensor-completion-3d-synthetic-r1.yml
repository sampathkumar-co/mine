name: LEXIGEN v4 Task 5 Tensor Completion 3D Synthetic R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/05-tensor-completion-3d/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/05-tensor-completion-3d/requirements.txt
      - name: Verify immutable campaign locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify frozen Task 5 candidate package
        working-directory: lexigen-v4/tasks/05-tensor-completion-3d
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "TASK_START.json": "dabf4ce6a6bbe0f702fd6b72ee3a85ec051a26eb",
              "SOURCE_ANALYSIS_RESULT.json": "214e4501d2c070326aaa3a68b74929082e76a076",
              "CANDIDATE_PROVENANCE.json": "1d288c6cef0a04d843a6c2879c3c74f3e73af42d",
              "candidates.py": "d979e8da1ef85f2b91b8db90941418c6ced9a006",
              "requirements.txt": "c2de4ad80fe973e7e89443033f32d0f3174eba1e",
              "synthetic_validate.py": "2f57682bfdde5cb4ae907e82ef8b366ee2c4fa44",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          print("LEXIGEN_V4_TASK5_SYNTHETIC_R1_PACKAGE_FROZEN")
          PY
      - name: Install frozen dependencies
        working-directory: lexigen-v4/tasks/05-tensor-completion-3d
        run: pip install -r requirements.txt
      - name: Execute independent synthetic correctness gate
        working-directory: lexigen-v4/tasks/05-tensor-completion-3d
        run: python -u synthetic_validate.py --output synthetic-evidence
      - name: Upload positive or negative synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task5-tensor-completion-3d-synthetic-r1
          path: lexigen-v4/tasks/05-tensor-completion-3d/synthetic-evidence/
          if-no-files-found: warn
          retention-days: 90
