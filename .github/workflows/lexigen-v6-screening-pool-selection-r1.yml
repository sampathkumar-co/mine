name: LEXIGEN v6 Screening Pool Selection R1
on:
  pull_request:
    branches: [lexigen/v5-task10-causal-audit-result-r1]
    paths: ["lexigen-v6/TRIGGER_SCREENING_POOL_R1"]
permissions: {contents: read}
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen v6 selection package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/SCREENING_POOL_R1_LOCK.json').read_text())
          for k,p in lock['paths'].items():
            got=subprocess.check_output(['git','hash-object',p],text=True).strip()
            if got!=lock['git_blob_sha1'][k]:raise SystemExit(f'v6 selection lock mismatch {k}')
          if any(lock[k] for k in ['task_sources_opened_before_lock','task_descriptions_opened_before_lock','data_manifests_opened_before_lock','data_payloads_opened_before_lock','public_solvers_opened_before_lock']):raise SystemExit('v6 preselection contamination')
          PY
      - run: python -m py_compile lexigen-v6/selector.py
      - name: Select 24-task metadata-only screening pool
        run: python lexigen-v6/selector.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-screening-pool-selection-r1
          path: selection-evidence/screening-pool-selection.json
          if-no-files-found: error
          retention-days: 90
