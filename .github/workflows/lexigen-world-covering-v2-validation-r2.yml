name: LEXIGEN World Covering v2 Corrected Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-world-covering-v2-validation-r2/TRIGGER_ONCE"

permissions:
  contents: read

jobs:
  validate-corrected-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-world-covering-v2/requirements.txt

      - name: Install frozen dependency
        run: python -m pip install -r lexigen-world-covering-v2/requirements.txt

      - name: Run snapshot-free corrected validation
        run: python -u lexigen-world-covering-v2-validation-r2/test_corrected_v2.py

      - name: Upload corrected validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-world-covering-v2-corrected-validation
          path: lexigen-world-covering-v2-validation-r2/VALIDATION_REPORT.json
          if-no-files-found: error
          retention-days: 90
