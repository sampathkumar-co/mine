name: Lexigen Language Genesis RIFT-0

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/**"
      - ".github/workflows/lexigen-language-genesis-rift0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rift0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out committed branch state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Run frozen benchmark validation
        working-directory: lexigen-language-genesis/benchmark
        run: python rift0.py --output artifacts/rift0/rift0-report.json

      - name: Run counterexample-guided prototype
        working-directory: lexigen-language-genesis/benchmark
        run: python prototype.py --output-dir artifacts/rift0

      - name: Synthesize bytecode ordering without a program template
        working-directory: lexigen-language-genesis/benchmark
        run: python synthesis_experiment.py --output-dir artifacts/rift0

      - name: Run independent tests
        working-directory: lexigen-language-genesis/benchmark
        run: python -m pytest -q

      - name: Hash preserved evidence
        working-directory: lexigen-language-genesis/benchmark
        run: sha256sum artifacts/rift0/*.json | tee artifacts/rift0/SHA256SUMS

      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-language-genesis-rift0-${{ github.sha }}
          path: lexigen-language-genesis/benchmark/artifacts/rift0/
          if-no-files-found: error
          retention-days: 90
