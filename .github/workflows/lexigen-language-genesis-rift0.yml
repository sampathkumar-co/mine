name: Lexigen Language Genesis RIFT Gates

on:
  pull_request:
    paths:
      - "lexigen-language-genesis/**"
      - ".github/workflows/lexigen-language-genesis-rift0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out committed branch state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Run RIFT-0 frozen benchmark validation
        working-directory: lexigen-language-genesis/benchmark
        run: python rift0.py --output artifacts/rift0/rift0-report.json

      - name: Run RIFT-0 template scaffold
        working-directory: lexigen-language-genesis/benchmark
        run: python prototype.py --output-dir artifacts/rift0

      - name: Synthesize RIFT-0 bytecode ordering
        working-directory: lexigen-language-genesis/benchmark
        run: python synthesis_experiment.py --output-dir artifacts/rift0

      - name: Run RIFT-1 multi-mechanism synthesis
        working-directory: lexigen-language-genesis/benchmark
        run: python rift1.py --output-dir artifacts/rift1

      - name: Run RIFT-1 unlabeled MDL selection
        working-directory: lexigen-language-genesis/benchmark
        run: python rift1_selector.py --output-dir artifacts/rift1

      - name: Run RIFT-2 operator-family induction
        working-directory: lexigen-language-genesis/benchmark
        run: python rift2.py --output-dir artifacts/rift2

      - name: Run RIFT-3 compositional adaptation
        working-directory: lexigen-language-genesis/benchmark
        run: python rift3.py --output-dir artifacts/rift3

      - name: Run corrected RIFT-4 semantic-extension gate
        working-directory: lexigen-language-genesis/benchmark
        run: python rift4_revision2.py --output-dir artifacts/rift4

      - name: Run RIFT-5 verifier co-synthesis gate
        working-directory: lexigen-language-genesis/benchmark
        run: python rift5.py --output-dir artifacts/rift5

      - name: Run independent tests
        working-directory: lexigen-language-genesis/benchmark
        run: python -m pytest -q

      - name: Hash preserved evidence
        working-directory: lexigen-language-genesis/benchmark
        run: |
          for directory in artifacts/rift0 artifacts/rift1 artifacts/rift2 artifacts/rift3 artifacts/rift4 artifacts/rift5; do
            sha256sum "$directory"/*.json | tee "$directory"/SHA256SUMS
          done

      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-language-genesis-rift-${{ github.sha }}
          path: lexigen-language-genesis/benchmark/artifacts/
          if-no-files-found: error
          retention-days: 90
