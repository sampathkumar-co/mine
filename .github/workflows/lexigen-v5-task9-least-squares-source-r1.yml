name: LEXIGEN v5 Task 9 Least Squares Source R1
on:
  pull_request:
    branches: [lexigen/v5-task8-kernel-density-estimation-result-r1]
    paths: ["lexigen-v5/tasks/09-least-squares/TRIGGER_SOURCE_R1"]
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen campaign scientific files
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/ENGINE_LOCK.json').read_text())
          for k,p in {'PROTOCOL.md':'lexigen-v5/PROTOCOL.md','TRANSFER_MEMORY.json':'lexigen-v5/TRANSFER_MEMORY.json','CONTAMINATION_EXCLUSIONS.json':'lexigen-v5/CONTAMINATION_EXCLUSIONS.json','engine.py':'lexigen-v5/engine.py','selector.py':'lexigen-v5/selector.py','selftest.py':'lexigen-v5/selftest.py'}.items():
            if subprocess.check_output(['git','hash-object',p],text=True).strip()!=lock['git_blob_sha1'][k]:raise SystemExit(f'campaign mismatch {k}')
          PY
      - name: Verify Task 9 source lock before source access
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/tasks/09-least-squares/SOURCE_R1_LOCK.json').read_text())
          for k,p in {'TASK_START.json':'lexigen-v5/tasks/09-least-squares/TASK_START.json','prepare_source.py':'lexigen-v5/tasks/09-least-squares/prepare_source.py','workflow':'.github/workflows/lexigen-v5-task9-least-squares-source-r1.yml'}.items():
            if subprocess.check_output(['git','hash-object',p],text=True).strip()!=lock['git_blob_sha1'][k]:raise SystemExit(f'Task9 lock mismatch {k}')
          if any(lock.get(k) for k in ['task_source_opened_before_lock','task_description_opened_before_lock','training_manifest_opened_before_lock','training_payloads_opened_before_lock','test_manifest_opened_before_lock','test_payloads_opened_before_lock']):raise SystemExit('boundary crossed')
          PY
      - name: Compile frozen source package
        run: python -m py_compile lexigen-v5/tasks/09-least-squares/prepare_source.py lexigen-v5/engine.py
      - name: Execute source-only analysis
        env: {PYTHONPATH: lexigen-v5}
        run: python lexigen-v5/tasks/09-least-squares/prepare_source.py --task-start lexigen-v5/tasks/09-least-squares/TASK_START.json --output source-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task9-least-squares-source-r1
          path: source-evidence/
          if-no-files-found: error
          retention-days: 90
