name: LEXIGEN v5 Task 4 Quantile Regression Source R1

on:
  pull_request:
    branches:
      - lexigen/v5-task3-spectral-clustering-result-r1
    paths:
      - "lexigen-v5/tasks/04-quantile-regression/TRIGGER_SOURCE_R1"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen campaign scientific files
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/ENGINE_LOCK.json').read_text())
          for key,path in {
            'PROTOCOL.md':'lexigen-v5/PROTOCOL.md',
            'TRANSFER_MEMORY.json':'lexigen-v5/TRANSFER_MEMORY.json',
            'CONTAMINATION_EXCLUSIONS.json':'lexigen-v5/CONTAMINATION_EXCLUSIONS.json',
            'engine.py':'lexigen-v5/engine.py',
            'selector.py':'lexigen-v5/selector.py',
            'selftest.py':'lexigen-v5/selftest.py'
          }.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            if actual!=lock['git_blob_sha1'][key]: raise SystemExit(f'frozen campaign mismatch {key}')
          PY
      - name: Verify Task 4 source lock before source access
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/tasks/04-quantile-regression/SOURCE_R1_LOCK.json').read_text())
          for key,path in {
            'TASK_START.json':'lexigen-v5/tasks/04-quantile-regression/TASK_START.json',
            'prepare_source.py':'lexigen-v5/tasks/04-quantile-regression/prepare_source.py',
            'workflow':'.github/workflows/lexigen-v5-task4-quantile-regression-source-r1.yml'
          }.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            if actual!=lock['git_blob_sha1'][key]: raise SystemExit(f'Task 4 source lock mismatch {key}: {actual}')
          for key in ('task_source_opened_before_lock','task_description_opened_before_lock','training_manifest_opened_before_lock','training_payloads_opened_before_lock','test_manifest_opened_before_lock','test_payloads_opened_before_lock','reports_opened_before_lock','public_solvers_opened_before_lock'):
            if lock.get(key): raise SystemExit(f'boundary flag true: {key}')
          PY
      - name: Compile frozen source package
        run: python -m py_compile lexigen-v5/tasks/04-quantile-regression/prepare_source.py lexigen-v5/engine.py
      - name: Execute source-only analysis
        env:
          PYTHONPATH: lexigen-v5
        run: >-
          python lexigen-v5/tasks/04-quantile-regression/prepare_source.py
          --task-start lexigen-v5/tasks/04-quantile-regression/TASK_START.json
          --output source-evidence
      - name: Upload immutable source evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task4-quantile-regression-source-r1
          path: source-evidence/
          if-no-files-found: error
          retention-days: 90
