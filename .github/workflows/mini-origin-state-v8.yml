name: Mini-ORIGIN State v0.8

on:
  push:
    paths:
      - ".github/workflows/mini-origin-state-v8.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-state-v8-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.8 is complete; use workflow_dispatch to reproduce the state-invention study."

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_state_invention_v8.py

  state-invention:
    if: github.event_name == 'workflow_dispatch'
    name: state-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [81, 82, 83]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: >-
          mkdir -p results &&
          python -m mini_origin.state_invention_v8
          --seed ${{ matrix.seed }}
          --output results/state-v8-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-state-v8-seed-${{ matrix.seed }}
          path: mini-origin/results/state-v8-seed-${{ matrix.seed }}.json
          retention-days: 90

  aggregate-state-study:
    if: github.event_name == 'workflow_dispatch'
    needs: [tests, state-invention]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-origin-state-v8-seed-*
          path: state-artifacts
          merge-multiple: true
      - run: |
          python - <<'PY'
          import glob, json, statistics
          from pathlib import Path
          rows=[]
          for filename in sorted(glob.glob("state-artifacts/*.json")):
              data=json.loads(Path(filename).read_text(encoding="utf-8"))
              rows.append({
                  "seed":data["seed"],"status":data["status"],
                  "strict_invented_score":data["strict_invented_score"],
                  "strict_one_state_score":data["strict_one_state_score"],
                  "strict_hand_score":data["strict_hand_score"]})
          invented=[r["strict_invented_score"] for r in rows]
          one=[r["strict_invented_score"]-r["strict_one_state_score"] for r in rows]
          hand=[r["strict_invented_score"]-r["strict_hand_score"] for r in rows]
          passing=[r for r in rows if r["status"]=="counterexample_driven_state_invention_candidate"]
          summary={"verdict":"replicated_counterexample_driven_state_invention_candidate"
              if len(passing)>=2 and statistics.median(invented)>=0.72
              and statistics.median(one)>=0.35 and statistics.median(hand)>=0.06 else "not_yet",
              "runs":rows}
          Path("state-v8-summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-state-v8-summary
          path: state-v8-summary.json
          retention-days: 90
