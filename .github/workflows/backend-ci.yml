name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Normalize persisted expiry comparisons
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path("app/api/operations_routes.py")
          text = routes.read_text()
          text = text.replace(
              "from app.core.security import hash_password\n",
              "from app.core.security import hash_password\nfrom app.core.time import is_expired_at\n",
          )
          text = text.replace(
              "invitation.revoked_at or invitation.accepted_at or invitation.expires_at <= now",
              "invitation.revoked_at or invitation.accepted_at or is_expired_at(invitation.expires_at, now=now)",
          )
          routes.write_text(text)

          storage = Path("app/services/storage.py")
          text = storage.read_text()
          marker = "from app.core.config import Settings\n"
          if "from app.core.time import is_expired_at\n" not in text:
              text = text.replace(marker, marker + "from app.core.time import is_expired_at\n")
          text = text.replace(
              "return upload.expires_at <= datetime.now(UTC)",
              "return is_expired_at(upload.expires_at)",
          )
          storage.write_text(text)
          PY
          ruff check app/api/operations_routes.py app/services/storage.py --fix
          if ! git diff --quiet -- app/api/operations_routes.py app/services/storage.py; then
            git config user.name "director-os-ci"
            git config user.email "director-os-ci@users.noreply.github.com"
            git add app/api/operations_routes.py app/services/storage.py
            git commit -m "Normalize persisted expiry timestamps"
            git push
          fi
      - run: ruff check .
      - name: Validate Alembic migrations
        env:
          DIRECTOR_ENVIRONMENT: test
          DIRECTOR_DATABASE_URL: sqlite+pysqlite:///./migration_test.db
          DIRECTOR_AUTH_SECRET: migration-test-secret-change-me
        run: |
          alembic upgrade head
          alembic current
          rm -f migration_test.db
      - run: pytest --cov=app --cov-report=term-missing
