name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Generate Ruff fix diff
        run: ruff check . --fix --diff > ruff-fix.diff || true
      - name: Upload Ruff fix diff
        uses: actions/upload-artifact@v4
        with:
          name: operations-ruff-fix
          path: backend/ruff-fix.diff
      - run: ruff check .
      - name: Validate Alembic migrations
        env:
          DIRECTOR_ENVIRONMENT: test
          DIRECTOR_DATABASE_URL: sqlite+pysqlite:///./migration_test.db
          DIRECTOR_AUTH_SECRET: migration-test-secret-change-me
        run: |
          alembic upgrade head
          alembic current
          rm -f migration_test.db
      - run: pytest --cov=app --cov-report=term-missing
