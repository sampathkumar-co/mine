name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Apply Ruff fixes
        run: |
          ruff check . --fix || true
          if ! git diff --quiet; then
            git config user.name "director-os-ci"
            git config user.email "director-os-ci@users.noreply.github.com"
            git add .
            git commit -m "Fix backend lint"
            git push
          fi
      - run: ruff check .
      - name: Validate Alembic migrations
        env:
          DIRECTOR_ENVIRONMENT: test
          DIRECTOR_DATABASE_URL: sqlite+pysqlite:///./migration_test.db
          DIRECTOR_AUTH_SECRET: migration-test-secret-change-me
        run: |
          alembic upgrade head
          alembic current
          rm -f migration_test.db
      - run: pytest --cov=app --cov-report=term-missing
