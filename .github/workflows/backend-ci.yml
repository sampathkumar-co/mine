name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "ops/**"
      - "VERSION"
      - ".env.production.example"
      - "compose.production.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ops/**"
      - "VERSION"
      - ".env.production.example"
      - "compose.production.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - name: Validate operations scripts
        working-directory: .
        run: |
          bash -n ops/backup.sh ops/restore.sh ops/smoke.sh ops/go_live.sh
          python3 -m py_compile ops/release_doctor.py ops/release_manifest.py
      - name: Validate Alembic migrations
        env:
          DIRECTOR_ENVIRONMENT: test
          DIRECTOR_DATABASE_URL: sqlite+pysqlite:///./migration_test.db
          DIRECTOR_AUTH_SECRET: migration-test-secret-change-me
        run: |
          alembic upgrade head
          alembic current
          rm -f migration_test.db
      - name: Run backend suite
        run: |
          set -o pipefail
          pytest --cov=app --cov-report=term-missing 2>&1 | tee ../backend-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-log
          path: backend-test.log
          retention-days: 14
