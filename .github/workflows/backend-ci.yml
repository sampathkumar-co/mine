name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: ruff check . --output-format=concise | tee ruff-report.txt
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: backend/ruff-report.txt
      - name: Enforce Ruff result
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: set -o pipefail; pytest --cov=app --cov-report=term-missing | tee pytest-report.txt
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.txt
      - name: Enforce pytest result
        if: steps.pytest.outcome == 'failure'
        run: exit 1
