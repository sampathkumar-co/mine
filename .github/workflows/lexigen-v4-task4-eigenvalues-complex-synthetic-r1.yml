name: LEXIGEN v4 Task 4 Eigenvalues Complex Synthetic R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/04-eigenvalues-complex/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lexigen-v4/tasks/04-eigenvalues-complex/requirements-synthetic.txt
      - name: Verify immutable engine and selection locks
        working-directory: lexigen-v4
        run: |
          python -u verify_engine_lock.py
          python -u verify_selection_lock.py
      - name: Verify frozen Task 4 synthetic package
        working-directory: lexigen-v4/tasks/04-eigenvalues-complex
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "TASK_START.json": "826fac27294bef020af36c5b48f793172753b455",
              "SOURCE_ANALYSIS_RESULT.json": "0b2bbc40f0443282ad74f8ef7fa3570c0f45f0d4",
              "candidates.py": "efea5bda4bfbfa620fd65f551792d48bd619979e",
              "requirements.txt": "2c04913adbf4e70b866f8fb7bb603abef158bbda",
              "requirements-synthetic.txt": "31850c1530c53660a933a1fe4bb57abb8bc703f1",
              "validate_candidates.py": "11412d6aab0647c8ab18dc46535453fdece92ebb",
          }
          for name, wanted in expected.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"{name} blob mismatch: {actual} != {wanted}")
          print("LEXIGEN_V4_TASK4_SYNTHETIC_R1_PACKAGE_FROZEN")
          PY
      - name: Install frozen candidate and independent oracle dependencies
        working-directory: lexigen-v4/tasks/04-eigenvalues-complex
        run: python -m pip install --upgrade pip && pip install -r requirements-synthetic.txt
      - name: Execute independent high-precision synthetic oracle gate
        working-directory: lexigen-v4/tasks/04-eigenvalues-complex
        run: python -u validate_candidates.py
      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task4-eigenvalues-complex-synthetic-r1
          path: lexigen-v4/tasks/04-eigenvalues-complex/synthetic-evidence/
          if-no-files-found: error
          retention-days: 90
