name: Mini-ORIGIN PySTreeD Probe Activation v0.55

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/pystreed_probe_activation_v55.py"
      - "mini-origin/tests/test_pystreed_probe_activation_v55.py"
      - ".github/workflows/mini-origin-v55-probe-activated-quotient.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/pystreed_probe_activation_v55.py"
      - "mini-origin/tests/test_pystreed_probe_activation_v55.py"
      - ".github/workflows/mini-origin-v55-probe-activated-quotient.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v55-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify probe activation protocol
        run: pytest -q tests/test_pystreed_probe_activation_v55.py
      - name: Clone pinned PySTreeD source
        run: |
          rm -rf results/v55
          mkdir -p results/v55
          git clone --filter=blob:none https://github.com/AlgTUDelft/pystreed.git results/v55/pystreed-source
          git -C results/v55/pystreed-source checkout 9ad41626a1f26c4b7481e8360c5c8b1871e10d96
          test "$(git -C results/v55/pystreed-source rev-parse HEAD)" = "9ad41626a1f26c4b7481e8360c5c8b1871e10d96"
      - name: Select and validate probe activation policy
        run: >-
          python -m mini_origin.pystreed_probe_activation_v55
          --source results/v55/pystreed-source
          --work results/v55/work
          --output results/v55/pystreed-probe-activation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-origin-v55-probe-activation
          path: |
            mini-origin/results/v55/pystreed-probe-activation.json
            mini-origin/results/v55/work/datasets
          if-no-files-found: warn
          retention-days: 90
