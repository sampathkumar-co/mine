name: LEXIGEN v5 Task 3 Spectral Clustering Synthetic R1

on:
  pull_request:
    branches:
      - lexigen/v5-task2-aes-gcm-encryption-result-r1
    paths:
      - "lexigen-v5/tasks/03-spectral-clustering/TRIGGER_SYNTHETIC_R1"

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen campaign scientific files
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('lexigen-v5/ENGINE_LOCK.json').read_text())
          expected = lock['git_blob_sha1']
          paths = {
              'PROTOCOL.md': 'lexigen-v5/PROTOCOL.md',
              'TRANSFER_MEMORY.json': 'lexigen-v5/TRANSFER_MEMORY.json',
              'CONTAMINATION_EXCLUSIONS.json': 'lexigen-v5/CONTAMINATION_EXCLUSIONS.json',
              'engine.py': 'lexigen-v5/engine.py',
              'selector.py': 'lexigen-v5/selector.py',
              'selftest.py': 'lexigen-v5/selftest.py',
          }
          for key, path in paths.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if actual != expected[key]:
                  raise SystemExit(f'frozen file mismatch {key}: {actual}')
          PY
      - name: Verify Task 3 synthetic lock before execution
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('lexigen-v5/tasks/03-spectral-clustering/SYNTHETIC_R1_LOCK.json').read_text())
          paths = {
              'SOURCE_R1_RESULT.json': 'lexigen-v5/tasks/03-spectral-clustering/SOURCE_R1_RESULT.json',
              'candidates.py': 'lexigen-v5/tasks/03-spectral-clustering/candidates.py',
              'DEPENDENCY_PIN.json': 'lexigen-v5/tasks/03-spectral-clustering/DEPENDENCY_PIN.json',
              'validate_synthetic.py': 'lexigen-v5/tasks/03-spectral-clustering/validate_synthetic.py',
              'workflow': '.github/workflows/lexigen-v5-task3-spectral-clustering-synthetic-r1.yml',
          }
          for key, path in paths.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              if actual != lock['git_blob_sha1'][key]:
                  raise SystemExit(f'Task 3 synthetic lock mismatch {key}: {actual}')
          if lock.get('official_training_manifest_opened_before_lock') or lock.get('official_training_payloads_opened_before_lock'):
              raise SystemExit('official training was opened before synthetic lock')
          if lock.get('official_test_manifest_opened_before_lock') or lock.get('official_test_payloads_opened_before_lock'):
              raise SystemExit('official test was opened before synthetic lock')
          if int(lock.get('candidate_count', -1)) != 30 or int(lock.get('synthetic_case_count', -1)) != 6:
              raise SystemExit('Task 3 synthetic cardinality mismatch')
          PY
      - name: Compile frozen Task 3 candidate package
        run: python -m py_compile lexigen-v5/tasks/03-spectral-clustering/candidates.py lexigen-v5/tasks/03-spectral-clustering/validate_synthetic.py
      - name: Install frozen benchmark dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Execute frozen synthetic gate
        working-directory: lexigen-v5/tasks/03-spectral-clustering
        run: python validate_synthetic.py --output synthetic-evidence
      - name: Upload immutable synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task3-spectral-clustering-synthetic-r1
          path: lexigen-v5/tasks/03-spectral-clustering/synthetic-evidence/
          if-no-files-found: error
          retention-days: 90
