name: LEXIGEN v4 Task 8 DST Type II SciPy FFTPACK Source R1

on:
  pull_request:
    branches: [main]
    paths:
      - "lexigen-v4/tasks/08-dst-type-II-scipy-fftpack/TRIGGER_SOURCE_ANALYSIS_R1"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile frozen engine and generic task analyser
        working-directory: lexigen-v4
        run: python -m compileall -q engine.py engine_v2.py engine_v3.py engine_v4.py verify_engine_lock.py verify_selection_lock.py prepare_selected_task.py
      - name: Verify immutable engine lock
        working-directory: lexigen-v4
        run: python -u verify_engine_lock.py
      - name: Verify immutable selection lock
        working-directory: lexigen-v4
        run: python -u verify_selection_lock.py
      - name: Generate all-arm proposals from frozen Task 8 source only
        working-directory: lexigen-v4
        run: python -u prepare_selected_task.py --task-start tasks/08-dst-type-II-scipy-fftpack/TASK_START.json --output tasks/08-dst-type-II-scipy-fftpack/source-analysis-evidence
      - name: Upload immutable source-analysis evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v4-task8-dst-type-ii-scipy-fftpack-source-r1
          path: lexigen-v4/tasks/08-dst-type-II-scipy-fftpack/source-analysis-evidence/
          if-no-files-found: error
          retention-days: 90
