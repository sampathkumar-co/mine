name: Mini-ORIGIN Exact Quotient v0.42

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/exact_quotient_certificate_v42.py"
      - "mini-origin/tests/test_exact_quotient_certificate_v42.py"
      - ".github/workflows/mini-origin-v42-exact-quotient.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/exact_quotient_certificate_v42.py"
      - "mini-origin/tests/test_exact_quotient_certificate_v42.py"
      - ".github/workflows/mini-origin-v42-exact-quotient.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v42-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Verify theorem and matched exact solver
        run: pytest -q tests/test_exact_quotient_certificate_v42.py
      - name: Run exact quotient certificate
        run: >-
          mkdir -p results &&
          python -m mini_origin.exact_quotient_certificate_v42
          --output results/v42-certificate.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v42-certificate
          path: mini-origin/results/v42-certificate.json
          retention-days: 90
