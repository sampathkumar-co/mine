name: LEXIGEN v5 Task 5 Earth Movers Distance Synthetic R2
on:
  pull_request:
    branches: [lexigen/v5-task4-quantile-regression-result-r1]
    paths: ["lexigen-v5/tasks/05-earth-movers-distance/TRIGGER_SYNTHETIC_R2"]
permissions: {contents: read}
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen Task 5 synthetic R2 package before execution
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v5/tasks/05-earth-movers-distance/SYNTHETIC_R2_LOCK.json').read_text())
          paths={'SOURCE_R1_RESULT.json':'lexigen-v5/tasks/05-earth-movers-distance/SOURCE_R1_RESULT.json','candidates.py':'lexigen-v5/tasks/05-earth-movers-distance/candidates.py','CANDIDATE_PROVENANCE.json':'lexigen-v5/tasks/05-earth-movers-distance/CANDIDATE_PROVENANCE.json','DEPENDENCY_PIN_R2.json':'lexigen-v5/tasks/05-earth-movers-distance/DEPENDENCY_PIN_R2.json','validate_synthetic.py':'lexigen-v5/tasks/05-earth-movers-distance/validate_synthetic.py','workflow':'.github/workflows/lexigen-v5-task5-earth-movers-distance-synthetic-r2.yml'}
          for k,p in paths.items():
            if subprocess.check_output(['git','hash-object',p],text=True).strip()!=lock['git_blob_sha1'][k]: raise SystemExit(f'Task5 synthetic R2 lock mismatch {k}')
          if lock['candidate_code_changed_from_r1'] or lock['validator_changed_from_r1']: raise SystemExit('scientific code changed')
          PY
      - name: Compile unchanged Task 5 candidate package
        run: python -m py_compile lexigen-v5/tasks/05-earth-movers-distance/candidates.py lexigen-v5/tasks/05-earth-movers-distance/validate_synthetic.py
      - name: Install executable frozen dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==1.26.4 scipy==1.15.3 POT==0.9.6.post1
      - name: Execute unchanged frozen synthetic gate
        working-directory: lexigen-v5/tasks/05-earth-movers-distance
        run: python validate_synthetic.py --output synthetic-evidence-r2
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v5-task5-earth-movers-distance-synthetic-r2
          path: lexigen-v5/tasks/05-earth-movers-distance/synthetic-evidence-r2/
          if-no-files-found: error
          retention-days: 90
