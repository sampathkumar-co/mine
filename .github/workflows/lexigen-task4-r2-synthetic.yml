name: LEXIGEN Task 4 Revision 2 Synthetic Gate

on:
  pull_request:
    paths:
      - ".github/workflows/lexigen-task4-r2-synthetic.yml"
      - "lexigen-public-runner/task4-r2/**"

permissions:
  contents: read

jobs:
  synthetic-exactness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lexigen-public-runner/task4-r2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Execute synthetic exactness gate only
        run: python synthetic_test.py
