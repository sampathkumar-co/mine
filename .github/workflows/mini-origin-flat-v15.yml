name: Mini-ORIGIN Flat Memory v0.15

on:
  push:
    paths:
      - "mini-origin/src/mini_origin/adversarial_flat_v15.py"
      - "mini-origin/tests/test_adversarial_flat_v15.py"
      - ".github/workflows/mini-origin-flat-v15.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/adversarial_flat_v15.py"
      - "mini-origin/tests/test_adversarial_flat_v15.py"
      - ".github/workflows/mini-origin-flat-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test v0.15 safeguards
        run: pytest -q tests/test_adversarial_flat_v15.py

  flat-search:
    name: flat-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [151, 152, 153]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Search counterfactually flat sparse memory
        run: >-
          mkdir -p results &&
          python -m mini_origin.adversarial_flat_v15
          --seed ${{ matrix.seed }}
          --output results/adversarial-flat-v15-seed-${{ matrix.seed }}.json
      - name: Upload v0.15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-flat-v15-seed-${{ matrix.seed }}
          path: mini-origin/results/adversarial-flat-v15-seed-${{ matrix.seed }}.json
          retention-days: 90

  aggregate-flat-study:
    needs: [tests, flat-search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mini-origin-flat-v15-seed-*
          path: flat-artifacts
          merge-multiple: true
      - name: Aggregate independent v0.15 searches
        run: |
          python - <<'PY'
          import glob
          import json
          import statistics
          from pathlib import Path

          rows = []
          for filename in sorted(glob.glob("flat-artifacts/*.json")):
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              rows.append({
                  "seed": data["seed"],
                  "status": data["status"],
                  "best_program": data["best_program"],
                  "strict_post_damage": data["strict_post_damage"],
                  "strict_iid_post_damage": data["strict_iid_post_damage"],
                  "strict_specialist_post_damage": data["strict_specialist_post_damage"],
                  "strict_retention": data["strict_retention"],
              })

          passing = [
              row for row in rows
              if row["status"] == "counterfactual_flat_memory_candidate"
          ]
          post = [row["strict_post_damage"] for row in rows]
          iid_gaps = [
              row["strict_post_damage"] - row["strict_iid_post_damage"]
              for row in rows
          ]
          specialist_gaps = [
              row["strict_post_damage"] - row["strict_specialist_post_damage"]
              for row in rows
          ]
          retention = [row["strict_retention"] for row in rows]
          summary = {
              "verdict": (
                  "replicated_external_breakthrough_candidate"
                  if len(passing) >= 2
                  and statistics.median(post) >= 0.86
                  and statistics.median(iid_gaps) >= 0.04
                  and statistics.median(specialist_gaps) >= 0.03
                  and statistics.median(retention) >= 0.90
                  else "not_yet"
              ),
              "claim_scope": (
                  "counterfactual attack-surface flattening under targeted deletion; "
                  "external status still requires coding-theory baselines, independent "
                  "implementation, outside reproduction and peer review"
              ),
              "run_count": len(rows),
              "passing_count": len(passing),
              "passing_seeds": [row["seed"] for row in passing],
              "post_min": min(post) if post else None,
              "post_median": statistics.median(post) if post else None,
              "iid_gap_min": min(iid_gaps) if iid_gaps else None,
              "iid_gap_median": statistics.median(iid_gaps) if iid_gaps else None,
              "specialist_gap_min": min(specialist_gaps) if specialist_gaps else None,
              "specialist_gap_median": statistics.median(specialist_gaps) if specialist_gaps else None,
              "retention_min": min(retention) if retention else None,
              "retention_median": statistics.median(retention) if retention else None,
              "runs": rows,
          }
          Path("adversarial-flat-v15-summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps({key: value for key, value in summary.items() if key != "runs"}, indent=2))
          PY
      - name: Upload aggregate v0.15 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-flat-v15-summary
          path: adversarial-flat-v15-summary.json
          retention-days: 90
