name: Mini-ORIGIN Proof-Carrying Reduction Synthesis v0.91

on:
  push:
    branches:
      - research/mini-origin-v91-proof-carrying-reduction-synthesis
    paths:
      - 'mini-origin/campaigns/v91-proof-carrying-reduction-synthesis.json'
      - 'mini-origin/src/mini_origin/proof_carrying_reduction_synthesis_v91.py'
      - 'mini-origin/tests/test_proof_carrying_reduction_synthesis_v91.py'
      - '.github/workflows/mini-origin-v91-proof-carrying-reduction-synthesis.yml'
  pull_request:
    paths:
      - '.github/workflows/mini-origin-v91-proof-carrying-reduction-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Mini-ORIGIN
        working-directory: mini-origin
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
      - name: Run v0.91 certificates
        working-directory: mini-origin
        run: |
          set -euo pipefail
          pytest -q tests/test_proof_carrying_reduction_synthesis_v91.py
      - name: Run preregistered synthesis and withheld transfer
        working-directory: mini-origin
        run: |
          set -euo pipefail
          mkdir -p results/v91
          python -m mini_origin.proof_carrying_reduction_synthesis_v91 \
            --output results/v91/proof-carrying-reduction-synthesis.json \
            2>&1 | tee results/v91/proof-carrying-reduction-synthesis.log
      - name: Upload v0.91 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v91-proof-carrying-reduction-synthesis
          path: |
            mini-origin/results/v91/proof-carrying-reduction-synthesis.json
            mini-origin/results/v91/proof-carrying-reduction-synthesis.log
          if-no-files-found: warn
