name: LEXIGEN V8 FVD Engine Development R1
on:
  pull_request:
    branches: [lexigen/v8-capability-pivot-r1]
    paths:
      - "lexigen-v8/FVD_EXPERIENCE_SCHEMA_R1.json"
      - "lexigen-v8/FVD_HISTORICAL_SOURCE_MANIFEST_R1.json"
      - "lexigen-v8/FVD_PROPOSAL_CLASSES_R1.json"
      - "lexigen-v8/FVD_HISTORICAL_REPLAY_PROTOCOL_R1.json"
      - "lexigen-v8/FVD_HISTORICAL_REPLAY_INPUT_R1.json"
      - "lexigen-v8/FVD_HISTORICAL_REPLAY_OUTCOMES_R1.json"
      - "lexigen-v8/build_fvd_experience_r1.py"
      - "lexigen-v8/fvd_allocator_r1.py"
      - "lexigen-v8/test_fvd_engine_dev_r1.py"
      - "lexigen-v8/prepare_fvd_historical_replay_r1.py"
      - "lexigen-v8/score_fvd_historical_replay_r1.py"
      - ".github/workflows/lexigen-v8-fvd-engine-dev-r1.yml"
permissions:
  contents: read
jobs:
  fvd-engine-development-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable parent capability protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lexigen-v8/CAPABILITY_BREAKTHROUGH_PROTOCOL_R1.json)" = "d347ba7cc29c0b024e925d267e523bd3f983007e"
          test "$(git hash-object lexigen-v8/ARCHITECTURE_TOURNAMENT_R2.md)" = "890658c52c4983cdf65f4b09364b00251a723e1c"
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('lexigen-v8/CAPABILITY_BREAKTHROUGH_PROTOCOL_R1.json').read_text())
          assert p['official_fvd_holdout_campaign_started'] is False
          assert p['real_ipwm_intervention_data_opened'] is False
          assert p['world_breakthrough_claim_allowed'] is False
          PY
      - name: Compile FVD development spine
        run: |
          python -m py_compile \
            lexigen-v8/strict_gate_runner.py \
            lexigen-v8/build_fvd_experience_r1.py \
            lexigen-v8/fvd_allocator_r1.py \
            lexigen-v8/test_fvd_engine_dev_r1.py \
            lexigen-v8/prepare_fvd_historical_replay_r1.py \
            lexigen-v8/score_fvd_historical_replay_r1.py
      - name: Validate frozen historical replay documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          protocol=json.loads(Path('lexigen-v8/FVD_HISTORICAL_REPLAY_PROTOCOL_R1.json').read_text())
          inputs=json.loads(Path('lexigen-v8/FVD_HISTORICAL_REPLAY_INPUT_R1.json').read_text())
          outcomes=json.loads(Path('lexigen-v8/FVD_HISTORICAL_REPLAY_OUTCOMES_R1.json').read_text())
          assert protocol['status'] == 'frozen_before_replay_execution'
          assert protocol['development_only'] is True
          assert protocol['official_fvd_holdout_campaign_started'] is False
          assert protocol['blocked_ipwm_real_intervention_data_opened'] is False
          assert protocol['scientific_transfer_evidence'] is False
          assert protocol['threshold_changes_after_execution_allowed'] is False
          assert protocol['task_changes_after_execution_allowed'] is False
          assert protocol['proposal_budget_per_task_per_arm'] == 16
          assert inputs['outcome_fields_present'] is False
          assert inputs['official_holdout_data_accessed'] is False
          assert len(inputs['tasks']) == protocol['replay_task_count'] == len(outcomes['tasks']) == 3
          assert {x['replay_id'] for x in inputs['tasks']} == {x['replay_id'] for x in outcomes['tasks']}
          PY
      - name: Build deterministic historical experience artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-fvd-dev-r1
          python lexigen-v8/build_fvd_experience_r1.py \
            --output evidence-fvd-dev-r1/FVD_EXPERIENCE_DEV_R1.json \
            | tee evidence-fvd-dev-r1/build-summary.json
      - name: Run strict FVD development canaries
        shell: bash
        run: |
          set -euo pipefail
          python lexigen-v8/strict_gate_runner.py \
            --output evidence-fvd-dev-r1/canary-result.json \
            -- python lexigen-v8/test_fvd_engine_dev_r1.py
      - name: Cross-check build and canary evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          artifact=json.loads(Path('evidence-fvd-dev-r1/FVD_EXPERIENCE_DEV_R1.json').read_text())
          canary=json.loads(Path('evidence-fvd-dev-r1/canary-result.json').read_text())
          assert canary['fvd_engine_dev_r1_passed'] is True
          assert canary['scientific_transfer_evidence'] is False
          assert canary['official_holdout_data_accessed'] is False
          assert artifact['artifact_sha256'] == canary['experience_artifact_sha256']
          assert artifact['official_holdout_data_accessed'] is False
          assert artifact['blocked_ipwm_real_intervention_data_accessed'] is False
          assert artifact['scientific_transfer_evidence_created_by_this_build'] is False
          payload={
            'stage':'v8_fvd_engine_development_r1',
            'development_only':True,
            'official_holdout_campaign_started':False,
            'scientific_transfer_evidence':False,
            'experience_artifact_sha256':artifact['artifact_sha256'],
            'experience_file_sha256':hashlib.sha256(Path('evidence-fvd-dev-r1/FVD_EXPERIENCE_DEV_R1.json').read_bytes()).hexdigest(),
            'canary_file_sha256':hashlib.sha256(Path('evidence-fvd-dev-r1/canary-result.json').read_bytes()).hexdigest(),
            'frontier_full_allocation':canary['frontier_full_allocation'],
            'frontier_no_experience_allocation':canary['frontier_no_experience_allocation'],
            'frontier_shuffled_allocation':canary['frontier_shuffled_allocation'],
            'precision_risk_full_allocation':canary['precision_risk_full_allocation'],
            'precision_risk_retrieval_allocation':canary['precision_risk_retrieval_allocation'],
          }
          Path('evidence-fvd-dev-r1/FVD_ENGINE_DEV_RESULT_R1.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload development canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v8-fvd-engine-development-r1
          path: evidence-fvd-dev-r1/
          if-no-files-found: error
          retention-days: 90
      - name: Stage 1 - source-only historical replay allocations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-fvd-replay-r1
          python lexigen-v8/prepare_fvd_historical_replay_r1.py \
            --budget 16 \
            --output evidence-fvd-replay-r1/STAGE1_ALLOCATIONS_R1.json \
            | tee evidence-fvd-replay-r1/stage1-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence-fvd-replay-r1/STAGE1_ALLOCATIONS_R1.json').read_text())
          assert p['outcomes_loaded'] is False
          assert p['outcome_file_opened'] is False
          assert p['all_source_hashes_verified'] is True
          assert p['all_leave_one_out_checks_pass'] is True
          assert p['all_equal_budget_checks_pass'] is True
          assert p['official_holdout_data_accessed'] is False
          assert p['blocked_ipwm_real_intervention_data_accessed'] is False
          assert p['scientific_transfer_evidence'] is False
          PY
      - name: Stage 2 - score frozen historical replay gates
        shell: bash
        run: |
          set -euo pipefail
          python lexigen-v8/strict_gate_runner.py \
            --output evidence-fvd-replay-r1/strict-score-run.json \
            -- python lexigen-v8/score_fvd_historical_replay_r1.py \
              --stage1 evidence-fvd-replay-r1/STAGE1_ALLOCATIONS_R1.json \
              --output evidence-fvd-replay-r1/HISTORICAL_REPLAY_RESULT_R1.json
      - name: Upload historical replay evidence even on scientific failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigen-v8-fvd-historical-replay-r1
          path: evidence-fvd-replay-r1/
          if-no-files-found: warn
          retention-days: 90
