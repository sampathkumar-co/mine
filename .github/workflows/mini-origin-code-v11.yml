name: Mini-ORIGIN Code v0.11

on:
  push:
    paths:
      - ".github/workflows/mini-origin-code-v11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-study-notice:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "v0.11 is complete and infeasible under the static-code constraints; use workflow_dispatch to reproduce it."

  reproduce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [111, 112, 113]
    defaults:
      run:
        working-directory: mini-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_coded_memory_v10.py tests/test_coded_memory_v11.py
      - run: >-
          mkdir -p results &&
          python -m mini_origin.coded_memory_v11
          --seed ${{ matrix.seed }}
          --output results/code-v11-seed-${{ matrix.seed }}.json
