name: LEXIGEN v6 Task1 Synthetic R1
on:
  pull_request:
    branches: [lexigen/v6-screening-result-r1]
    paths: ["lexigen-v6/tasks/01-max-flow-min-cost/TRIGGER_SYNTHETIC_R1"]
permissions: {contents: read}
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen Task1 synthetic package
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/01-max-flow-min-cost/SYNTHETIC_R1_LOCK.json').read_text())
          for key,path in lock['paths'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=lock['git_blob_sha1'][key]:raise SystemExit(f'synthetic lock mismatch {key}: {got}')
          if lock['official_train_manifest_opened_before_lock'] or lock['official_test_manifest_opened_before_lock'] or lock['public_task_specific_solvers_opened_before_lock']:
              raise SystemExit('Task1 synthetic boundary crossed')
          PY
      - name: Install frozen-snapshot compatible dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "numpy<3" "networkx<4" "ortools<9.12.0"
      - name: Fetch exact frozen task source
        shell: bash
        run: |
          curl -fsSL "https://raw.githubusercontent.com/oripress/AlgoTune/dff9914c10800c7a031c9e8c3d4d1c8cd1b38906/AlgoTuneTasks/max_flow_min_cost/max_flow_min_cost.py" -o task-source.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          lock=json.loads(Path('lexigen-v6/tasks/01-max-flow-min-cost/TASK_LOCK.json').read_text())
          got=hashlib.sha256(Path('task-source.py').read_bytes()).hexdigest()
          if got!=lock['source_sha256']:raise SystemExit(f'source sha mismatch {got}')
          PY
      - name: Compile frozen candidate and validation code
        run: python -m py_compile lexigen-v5/engine.py lexigen-v6/tasks/01-max-flow-min-cost/candidates.py lexigen-v6/tasks/01-max-flow-min-cost/synthetic.py
      - name: Run independent semantic synthetic validation
        run: python lexigen-v6/tasks/01-max-flow-min-cost/synthetic.py task-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v6-task1-synthetic-r1
          path: |
            synthetic-summary.json
            synthetic-results.jsonl
            synthetic-candidate-plan.json
          if-no-files-found: error
          retention-days: 90
