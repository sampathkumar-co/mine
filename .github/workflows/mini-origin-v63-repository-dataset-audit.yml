name: Mini-ORIGIN Repository Dataset Audit v0.63

on:
  push:
    branches:
      - research/mini-origin-v63-repository-dataset-audit
    paths:
      - "mini-origin/src/mini_origin/repository_dataset_audit_v63.py"
      - ".github/workflows/mini-origin-v63-repository-dataset-audit.yml"
  pull_request:
    paths:
      - "mini-origin/src/mini_origin/repository_dataset_audit_v63.py"
      - ".github/workflows/mini-origin-v63-repository-dataset-audit.yml"
  workflow_dispatch:

concurrency:
  group: mini-origin-v63-dataset-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-dataset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch every remote branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-origin/pyproject.toml
      - name: Install Mini-ORIGIN
        working-directory: mini-origin
        run: python -m pip install -e ".[dev]"
      - name: Build repository-wide dataset registry
        run: >-
          mkdir -p mini-origin/results/v63 &&
          PYTHONPATH=mini-origin/src
          python -m mini_origin.repository_dataset_audit_v63
          --output mini-origin/results/v63/repository-dataset-registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-origin-v63-repository-dataset-registry
          path: mini-origin/results/v63/repository-dataset-registry.json
          retention-days: 90
