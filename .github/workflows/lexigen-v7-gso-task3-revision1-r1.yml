name: LEXIGEN V7 GSO Task3 Revision1 R1
on:
  pull_request:
    branches: [lexigen/v7-gso-tasks3-6-preflight-r2]
    paths: ["lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/TRIGGER_REVISION1_R1"]
permissions: {contents: read}
jobs:
  revision1:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen Task3 revision1 execution lock
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/REVISION1_EXECUTION_LOCK_R1.json').read_text())
          paths={
            'preflight_r2_result':'lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/PREFLIGHT_R2_RESULT.json',
            'revision_plan':'lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/REVISION1_PLAN_R1.json',
            'materialization_lock':'lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/REVISION1_MATERIALIZATION_LOCK_R1.json',
            'builder':'lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/build_revision1_r1.py',
            'runner':'lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/run_revision1_r1.py',
            'preflight_r2_lock':'lexigen-v7-gso/TASKS3_6_PREFLIGHT_LOCK_R2.json',
            'core_runner':'lexigen-v7-gso/run_tasks2_6_preflight_r1.py',
            'transport_r2':'lexigen-v7-gso/run_tasks3_6_preflight_r2.py',
            'workflow':'.github/workflows/lexigen-v7-gso-task3-revision1-r1.yml',
          }
          for key,path in paths.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=lock['git_blob_sha1'][key]: raise SystemExit(f'Task3 revision1 lock mismatch {key}: {got}')
          forbidden=['expert_opt_commit_accessed','expert_diff_accessed','hints_accessed','libraries_changed','thresholds_changed','task_changed','tests_changed','budget_increased']
          if any(lock.get(k) for k in forbidden): raise SystemExit('Task3 revision1 crossed frozen boundary')
          PY
      - name: Compile frozen revision machinery
        run: python -m py_compile lexigen-v7-gso/run_tasks2_6_preflight_r1.py lexigen-v7-gso/run_tasks3_6_preflight_r2.py lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/build_revision1_r1.py lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/run_revision1_r1.py
      - name: Install pinned safe-projector dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir duckdb==1.4.1
      - name: Recover only already-permitted Task3 spec and tests
        run: python lexigen-v7-gso/extract_selected_spec.py --instance-id huggingface__tokenizers-bfd9cde --output spec
      - name: Recover only non-expert execution metadata
        run: python lexigen-v7-gso/extract_execution_metadata_r1.py --instance-id huggingface__tokenizers-bfd9cde --output execmeta/EXECUTION_METADATA_R1.json
      - name: Pull frozen GSO base image
        run: docker pull slimshetty/gso:gso.eval.x86_64.huggingface__tokenizers-bfd9cde
      - name: Run equal-budget Task3 revision1
        shell: bash
        run: |
          python lexigen-v7-gso/tasks/03-tokenizers-encode-batch-fast/run_revision1_r1.py \
            --instance-id huggingface__tokenizers-bfd9cde \
            --image slimshetty/gso:gso.eval.x86_64.huggingface__tokenizers-bfd9cde \
            --target bindings/python/src/tokenizer.rs \
            --spec spec \
            --execmeta execmeta/EXECUTION_METADATA_R1.json \
            --output revision1/task-3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexigen-v7-gso-task3-revision1-r1
          path: revision1/task-3/
          if-no-files-found: error
          retention-days: 90
