name: LEXIGEN V7 Real Holdout Selection R2
on:
  pull_request:
    branches: [lexigen/v7-real-library-result-r1]
    paths: ["lexigen-v7-real/TRIGGER_SELECT_R2"]
permissions: {contents: read}
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen R2 selection lock
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('lexigen-v7-real/SELECTION_LOCK_R2.json').read_text())
          paths={
            'PROTOCOL.md':'lexigen-v7-real/PROTOCOL.md',
            'CONTAMINATION_EXCLUSIONS.json':'lexigen-v7-real/CONTAMINATION_EXCLUSIONS.json',
            'APPRENTICESHIP_TRACES.json':'lexigen-v7-real/APPRENTICESHIP_TRACES.json',
            'LIBRARY_R1_RESULT.json':'lexigen-v7-real/LIBRARY_R1_RESULT.json',
            'R1_SELECTION_FEASIBILITY_INCIDENT.json':'lexigen-v7-real/R1_SELECTION_FEASIBILITY_INCIDENT.json',
            'selector.py':'lexigen-v7-real/selector.py',
            'workflow':'.github/workflows/lexigen-v7-real-select-r2.yml',
          }
          for key,path in paths.items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=lock['git_blob_sha1'][key]: raise SystemExit(f'lock mismatch {key}: {got}')
          if lock['selection_executed_before_lock'] or lock['selected_names_known_before_lock'] or lock['selected_sources_opened_before_lock']:
              raise SystemExit('R2 selection boundary crossed')
          PY
      - name: Compile frozen R2 selector
        run: python -m py_compile lexigen-v7-real/selector.py
      - name: Select five fresh distant-family holdouts using names and metadata only
        working-directory: lexigen-v7-real
        run: python selector.py
      - uses: actions/upload-artifact@v4
        with:
          name: lexigen-v7-real-selection-r2
          path: lexigen-v7-real/selection-evidence/
          if-no-files-found: error
          retention-days: 90
